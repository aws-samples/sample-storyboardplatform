<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키 비주얼 · 스토리보드</title>
<link rel="icon" href="data:,">
<style>
/* ─────────────────────────────────────────────────────────
   흰 배경 · 시스템 서체 · 파란 한 가지 강조.
   demo/ 의 종이·테이프 톤과 겹치지 않게 일부러 다르게 잡았다.
   ───────────────────────────────────────────────────────── */
:root{
  --bg:#fff; --ink:#111318; --ink-2:#5b6472; --ink-3:#8b94a3;
  --line:#e4e7ec; --line-2:#f1f3f6; --fill:#f8f9fb;
  --blue:#1a56db; --blue-w:#eef2ff;
  --ok:#0f7b5f; --ok-w:#e7f6f0;
  --no:#b42318; --no-w:#fef3f2;
  --wait:#8b5cf6;
  --r:6px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --m:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--f);
  letter-spacing:-0.005em;
}
body.coaching{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:disabled{cursor:not-allowed;opacity:.42}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── 머리 ─────────────────────────────── */
header{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.bar{display:flex;align-items:center;gap:14px;padding:11px 20px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:650;letter-spacing:-.02em}
.brand span{color:var(--ink-3);font-weight:450;font-size:13px}
.tag{
  font:500 11px/1 var(--m);padding:4px 7px;border-radius:4px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--fill);
}
.tag--live{color:var(--ok);background:var(--ok-w);border-color:#bfe5d7}
.tag--local{color:var(--ink-2)}
.spacer{flex:1}
.ghost{
  font-size:13px;color:var(--ink-2);padding:6px 11px;border:1px solid var(--line);
  border-radius:var(--r);
}
.ghost:hover{background:var(--fill);color:var(--ink)}

/* ── 단계 탭 ───────────────────────────── */
#nav{display:flex;align-items:center;gap:0;padding:0 20px 12px;overflow-x:auto}
.tab{
  display:flex;align-items:center;gap:9px;padding:8px 13px;border-radius:var(--r);
  color:var(--ink-3);white-space:nowrap;
}
.tab:hover:not(:disabled){background:var(--fill)}
.tab__n{
  display:grid;place-items:center;width:21px;height:21px;flex:none;
  border:1px solid currentColor;border-radius:50%;font:600 11px/1 var(--m);
}
.tab__t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.tab__t b{font-weight:600;font-size:13.5px}
.tab__t span{font-size:11px;opacity:.8}
.tab[aria-current=true]{color:var(--blue);background:var(--blue-w)}
.tab[aria-current=true] .tab__n{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab__ok{color:var(--ok);font-size:12px}
.tab__sep{width:18px;height:1px;background:var(--line);flex:none}

/* ── 뼈대 ─────────────────────────────── */
.shell{display:grid;grid-template-columns:1fr 250px;align-items:start}
main{padding:20px;min-width:0}
.wrap{display:grid;gap:16px}
.wrap--2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.wrap--match{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
@media (max-width:1080px){
  .shell{grid-template-columns:1fr}
  .wrap--2,.wrap--match{grid-template-columns:1fr}
  aside{border-left:0!important;border-top:1px solid var(--line);position:static!important;max-height:none!important}
}
.wrap>div{display:grid;gap:16px;align-content:start;min-width:0}

.card{border:1px solid var(--line);border-radius:10px;padding:15px;background:#fff}
.card__h{font-size:13px;font-weight:650;letter-spacing:-.01em}
.card__s{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.card>*+*{margin-top:11px}
.note{font-size:12px;color:var(--ink-3);line-height:1.5}
.hint{font-size:12px;color:var(--ink-3)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{
  padding:9px 15px;border-radius:var(--r);font-weight:600;font-size:13.5px;
  border:1px solid transparent;
}
.btn--go{background:var(--blue);color:#fff}
.btn--go:hover:not(:disabled){background:#1543ad}
.btn--line{border-color:var(--line);color:var(--ink)}
.btn--line:hover:not(:disabled){background:var(--fill)}
.btn--wide{width:100%}

.warn{
  display:flex;gap:10px;align-items:center;margin-bottom:16px;padding:10px 13px;
  border:1px solid #f3c6c1;background:var(--no-w);color:#8d2019;border-radius:var(--r);
  font-size:13px;
}
.warn__x{margin-left:auto;font-size:12px;color:#8d2019;text-decoration:underline}

/* ── STEP 1 ───────────────────────────── */
.script{
  width:100%;min-height:330px;resize:vertical;padding:12px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--fill);
  font:400 12.5px/1.65 var(--m);white-space:pre-wrap;
}
.script:focus{background:#fff;border-color:var(--blue);outline:none}
.scenes{display:grid;gap:1px;background:var(--line-2);border-radius:var(--r);overflow:hidden}
.sc{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;
  padding:8px 10px;background:#fff;font-size:12.5px}
.sc__id{font:600 11px/1 var(--m);color:var(--blue)}
.sc__pl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc__bl{font:400 11px/1 var(--m);color:var(--ink-3)}

/* ── STEP 2 ───────────────────────────── */
.pr{padding:11px 0;border-top:1px solid var(--line-2)}
.pr:first-of-type{border-top:0}
.pr__top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pr__top b{font-size:12.5px;font-weight:600}
.pr__cast{font-size:11px;color:var(--ink-3)}
.pr__beat{font-size:12px;color:var(--ink-2);margin:3px 0 6px}
.pr__in{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);
  font:400 12px/1.5 var(--m);resize:vertical;background:var(--fill);
}
.pr__in:focus{background:#fff;border-color:var(--blue);outline:none}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:8px;font-size:13px}
.opt>span:first-child{width:52px;color:var(--ink-2)}
.opt select,.seed{
  padding:6px 9px;border:1px solid var(--line);border-radius:var(--r);background:#fff;
}
.seed{width:110px;font:400 12px var(--m)}

/* ── STEP 3 ───────────────────────────── */
.rig{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--fill)}
.rig__top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rig__st{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.led{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.rig--ready .led{background:var(--ok);box-shadow:0 0 0 3px var(--ok-w)}
.rig--busy .led,.rig--loading .led{background:var(--wait);animation:pulse 1.1s ease-in-out infinite}
.rig--down .led,.rig--error .led,.rig--none .led{background:var(--no)}
@keyframes pulse{50%{opacity:.28}}
.rig__wait{font:500 11px var(--m);color:var(--wait);background:#f4f0ff;padding:3px 7px;border-radius:4px}
.rig__gpu{margin-left:auto;font:400 11px var(--m);color:var(--ink-3)}
.rig__err{font-size:12px;color:var(--no);margin-top:8px;line-height:1.5}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin-top:11px}
.model{
  padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;
  text-align:left;display:grid;gap:2px;
}
.model b{font-size:12px;font-weight:600}
.model span{font-size:10.5px;color:var(--ink-3)}
.model--on{border-color:var(--blue);background:var(--blue-w)}
.model--res b::after{content:' ●';color:var(--ok);font-size:9px;vertical-align:middle}

.queue{display:grid;gap:1px;background:var(--line-2);border-radius:var(--r);overflow:hidden}
.q{
  display:grid;grid-template-columns:34px minmax(0,1fr) 62px auto;gap:9px;
  align-items:center;padding:8px 10px;background:#fff;
}
.q__id{font:600 11px/1 var(--m);color:var(--ink-3)}
.q__mid{min-width:0;display:grid;gap:1px}
.q__mid b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q__p{font:400 11px/1.4 var(--m);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q__err{font-size:11px;color:var(--no)}
.q__t{font:500 11px var(--m);color:var(--ink-3);text-align:right}
.q--running{background:#faf8ff}
.q--running .q__id,.q--running .q__t{color:var(--wait)}
.q--done .q__id{color:var(--ok)}
.q--failed{background:var(--no-w)}
.q--failed .q__id{color:var(--no)}
.mini{
  font-size:11.5px;padding:4px 9px;border:1px solid var(--line);border-radius:4px;
  color:var(--ink-2);background:#fff;
}
.mini:hover:not(:disabled){background:var(--fill);color:var(--ink)}

.log{display:grid;max-height:290px;overflow-y:auto;
  border:1px solid var(--line);border-radius:var(--r);background:#fbfcfd}
.l{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:5px 9px;
  font:400 11px/1.5 var(--m);border-bottom:1px solid var(--line-2);word-break:break-all}
.l:last-child{border-bottom:0}
.l time{color:var(--ink-3)}
.l--u span{color:var(--blue)}
.l--g span{color:var(--ok)}
.l--r span{color:var(--no)}

.perm{display:grid;gap:1px;background:var(--line-2);border-radius:var(--r);overflow:hidden}
.perm__r{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;
  padding:8px 10px;background:var(--ok-w);font-size:12.5px}
.perm__r b{font-weight:600;color:var(--ok)}
.perm__r span{color:var(--ink-2);font-size:12px}
.perm__r--no{background:var(--no-w)}
.perm__r--no b{color:var(--no)}

.scale{display:grid;gap:1px;background:var(--line-2);border-radius:var(--r);overflow:hidden}
.scale__r{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:baseline;
  padding:8px 10px;background:#fff;font-size:12.5px}
.scale__r b{font-weight:600;font-size:12px}
.scale__r span{color:var(--ink-2);font-size:12px}
.scale__r--on{background:var(--blue-w)}
.scale__r--on b{color:var(--blue)}
.scale__t{font:500 11px var(--m)!important;color:var(--ink-3)!important;text-align:right}
.path{font-size:12.5px}
.path summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:12.5px;padding:2px 0}
.path ol{margin:8px 0 0 17px;display:grid;gap:5px;color:var(--ink-2);font-size:12px;line-height:1.5}

/* ── STEP 4 ───────────────────────────── */
.scroll{max-height:560px;overflow-y:auto;display:grid;gap:1px;
  background:var(--line-2);border-radius:var(--r)}
.blk{display:grid;gap:3px;padding:9px 11px;text-align:left;background:#fff}
.blk:hover{background:var(--fill)}
.blk--on{background:var(--blue-w);box-shadow:inset 2px 0 0 var(--blue)}
.blk__id{font:600 10.5px/1 var(--m);color:var(--blue);letter-spacing:.02em}
.blk__t{font:400 12px/1.6 var(--m);white-space:pre-wrap;color:var(--ink)}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
.kv{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;
  text-align:left;position:relative;display:grid}
.kv--on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-w)}
/* 비율은 실제로 받은 크기를 따른다. 기본은 서버의 가로 크기. */
.kvgrid{--ar:1216/688}
.kv__im{width:100%;aspect-ratio:var(--ar);object-fit:cover;display:block;background:var(--fill)}
.kv__ph{aspect-ratio:var(--ar);display:grid;place-items:center;background:var(--fill);
  font:500 11px var(--m);color:var(--ink-3)}
.kv__cap{display:grid;gap:1px;padding:6px 8px;border-top:1px solid var(--line-2)}
.kv__cap b{font:600 10.5px/1 var(--m);color:var(--ink-3)}
.kv__cap span{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv__eyes{position:absolute;top:5px;right:5px;display:flex}
.eye{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;
  background:var(--blue);color:#fff;font:600 10px/1 var(--f);border:1.5px solid #fff;
  font-style:normal;margin-left:-5px}
.meta{display:grid;grid-template-columns:58px 1fr;gap:5px 10px;font-size:12.5px}
.meta dt{color:var(--ink-3);font-size:11.5px}
.meta dd{color:var(--ink);min-width:0;word-break:break-word}

/* ── 옆 기둥 ──────────────────────────── */
aside{
  position:sticky;top:99px;border-left:1px solid var(--line);padding:20px 16px;
  display:grid;gap:18px;align-content:start;max-height:calc(100vh - 99px);overflow-y:auto;
}
.side__h{font:600 11px/1 var(--f);color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.peer{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:5px 0}
.peer b{font-size:12.5px;font-weight:600;display:block}
.peer span{font-size:11px;color:var(--ink-3)}
.peer__at{font:400 10.5px var(--m);color:var(--ink-3)}
.av{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--fill);border:1px solid var(--line);color:var(--ink-2);
  font:600 11px/1 var(--f);font-style:normal;flex:none}
#feed{list-style:none;display:grid;gap:9px}
#feed li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:12px;line-height:1.45}
#feed b{font-weight:600}
#feed span{color:var(--ink-2)}
#feed time{display:block;font:400 10.5px var(--m);color:var(--ink-3);margin-top:1px}
.feed__none{color:var(--ink-3);font-size:12px;grid-template-columns:1fr!important}

/* ── 코치마크 ─────────────────────────── */
.coach{position:fixed;inset:0;z-index:90}
.coach__veil{position:absolute;inset:0;background:rgba(15,20,30,.52)}
/* 가리킬 것만 막 위로 올린다. 막에 구멍을 겹쳐 뚫으면 겹친 자리가 두 번 어두워진다. */
.coach-lit{
  position:relative;z-index:95;background:#fff;
  box-shadow:0 0 0 3px var(--blue),0 8px 26px rgba(15,20,30,.28);
}
.card.coach-lit{border-radius:10px}
.tab.coach-lit{border-radius:var(--r)}
.tag.coach-lit{border-radius:4px}
.coach__tag{
  position:absolute;z-index:96;font:600 11px/1 var(--f);color:#fff;background:var(--blue);
  padding:5px 9px;border-radius:4px;white-space:nowrap;pointer-events:none;
}
.coach__b{
  position:absolute;z-index:97;background:#fff;border-radius:10px;padding:16px;
  box-shadow:0 12px 34px rgba(15,20,30,.3);display:grid;gap:9px;
}
.coach__crumb{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--ink-3)}
.coach__n{margin-left:auto;font:500 11px var(--m);color:var(--blue)}
.coach__h{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.coach__p{font-size:13px;color:var(--ink-2);line-height:1.6}
.coach__p+.coach__p{margin-top:-6px}
.coach__dots{display:flex;gap:5px;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);font-style:normal}
.dot--on{background:var(--blue);width:16px;border-radius:3px}
.coach__row{display:flex;align-items:center;gap:8px;margin-top:3px}
.coach__skip{font-size:12.5px;color:var(--ink-3)}
.coach__skip:hover{color:var(--ink-2);text-decoration:underline}
.coach__next{
  margin-left:auto;background:var(--blue);color:#fff;padding:8px 16px;
  border-radius:var(--r);font-weight:600;font-size:13px;
}
.coach__next:hover{background:#1543ad}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">스토리보드 <span>키 비주얼</span></div>
    <span class="tag" id="modeTag">…</span>
    <span class="spacer"></span>
    <span class="tag" id="whoami" data-coach="whoami">…</span>
    <button class="ghost" id="coachBtn" type="button">안내 다시 보기</button>
    <a class="ghost" href="../demo/">보드로</a>
  </div>
  <nav id="nav" aria-label="단계"></nav>
</header>

<div class="shell">
  <main id="main"></main>
  <aside>
    <div>
      <p class="side__h">지금 보는 사람</p>
      <div id="peers"></div>
    </div>
    <div>
      <p class="side__h">보드에 남은 것</p>
      <ul id="feed"></ul>
    </div>
  </aside>
</div>

<p class="sr" id="live" role="status" aria-live="polite"></p>

<script src="/aws-config.js" onerror="window.SB_CONFIG=null"></script>
<script type="module" src="./keyvisual.js"></script>
</body>
</html>
