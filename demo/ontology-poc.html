<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ontology Story Engine — 케이팝 데몬 헌터스</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; overflow: hidden; }
  .app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 52px 1fr; height: 100vh; }
  .topbar { grid-column: 1 / -1; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; padding: 0 20px; gap: 16px; }
  .topbar h1 { font-size: 14px; font-weight: 600; color: #e6edf3; }
  .topbar .badge { font-size: 11px; background: #21262d; border: 1px solid #30363d; border-radius: 12px; padding: 2px 10px; color: #8b949e; }
  .graph-area { position: relative; overflow: hidden; background: #0d1117; }
  .sidebar { background: #161b22; border-left: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; }
  #network { width: 100%; height: 100%; }
  .tabs { display: flex; border-bottom: 1px solid #30363d; background: #161b22; flex-shrink: 0; }
  .tab { padding: 12px 16px; font-size: 12px; cursor: pointer; color: #8b949e; border-bottom: 2px solid transparent; transition: all .15s; user-select: none; }
  .tab:hover { color: #e6edf3; }
  .tab.active { color: #e6edf3; border-bottom-color: #f78166; }
  .panel { display: none; flex-direction: column; overflow: hidden; flex: 1; }
  .panel.active { display: flex; }
  .panel-scroll { overflow-y: auto; flex: 1; padding: 12px; }
  .panel-scroll::-webkit-scrollbar { width: 4px; }
  .panel-scroll::-webkit-scrollbar-track { background: transparent; }
  .panel-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
  .seed-card { background: #21262d; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all .15s; }
  .seed-card:hover { border-color: #58a6ff; background: #1c2128; }
  .seed-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .probe-tag { font-size: 10px; background: #0d2137; border: 1px solid #1f6feb; color: #79c0ff; border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
  .seed-score { font-size: 11px; color: #8b949e; margin-left: auto; }
  .seed-title { font-size: 12px; font-weight: 600; color: #e6edf3; margin-bottom: 4px; }
  .seed-rationale { font-size: 11px; color: #8b949e; line-height: 1.5; }
  .gen-btn { width: 100%; padding: 10px; background: #238636; border: 1px solid #2ea043; border-radius: 6px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; margin-top: 4px; }
  .gen-btn:hover { background: #2ea043; }
  .story-content { padding: 16px; font-size: 12px; line-height: 1.7; }
  .story-content h1 { font-size: 16px; font-weight: 700; color: #e6edf3; margin-bottom: 12px; }
  .story-content h2 { font-size: 13px; font-weight: 600; color: #79c0ff; margin: 14px 0 6px; }
  .story-content p { color: #c9d1d9; margin-bottom: 8px; }
  .stats-bar { display: flex; gap: 16px; padding: 8px 12px; border-bottom: 1px solid #30363d; background: #161b22; flex-shrink: 0; }
  .stat { display: flex; flex-direction: column; gap: 1px; }
  .stat .n { font-size: 16px; font-weight: 700; color: #e6edf3; }
  .stat .l { font-size: 10px; color: #8b949e; }

  /* 스토리 분기 UI */
  .seed-info { background: #0d2137; border: 1px solid #1f6feb; border-radius: 6px; padding: 9px 11px; margin-bottom: 12px; font-size: 10.5px; color: #79c0ff; line-height: 1.6; }
  .logline { color: #c9d1d9; font-size: 12px; line-height: 1.75; margin-bottom: 12px; }
  .pivot-box { background: #1c1400; border: 1px solid #9e6a03; border-radius: 6px; padding: 9px 11px; margin-bottom: 12px; font-size: 10.5px; line-height: 1.6; }
  .pivot-box .ttl { color: #e3b341; font-weight: 600; display: block; margin-bottom: 3px; }
  .pivot-box .bd { color: #c9d1d9; }

  .branch-chips { display: flex; gap: 5px; margin-bottom: 12px; }
  .branch-chip { flex: 1; padding: 7px 4px; text-align: center; background: #21262d; border: 1px solid #30363d; border-radius: 5px; cursor: pointer; font-size: 10px; color: #8b949e; transition: all .12s; line-height: 1.35; }
  .branch-chip:hover { border-color: #58a6ff; color: #e6edf3; }
  .branch-chip.on { background: #1c1014; border-color: #f78166; color: #ffb3a0; }
  .branch-chip .bid { display: block; font-size: 13px; font-weight: 700; }

  .branch-head { font-size: 13px; font-weight: 700; color: #e6edf3; margin-bottom: 3px; }
  .branch-tone { display: inline-block; font-size: 9.5px; background: #21262d; border: 1px solid #30363d; border-radius: 9px; padding: 1px 7px; color: #8b949e; margin-bottom: 8px; }
  .branch-premise { font-size: 11px; color: #8b949e; line-height: 1.65; margin-bottom: 11px; padding-left: 8px; border-left: 2px solid #30363d; }

  .beats { margin-bottom: 12px; }
  .beat { display: flex; gap: 8px; font-size: 11px; color: #c9d1d9; line-height: 1.65; margin-bottom: 7px; }
  .beat .no { flex-shrink: 0; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; background: #21262d; border: 1px solid #30363d; color: #8b949e; font-size: 9px; display: flex; align-items: center; justify-content: center; }

  .sec-label { font-size: 10px; color: #6e7681; text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 5px; }
  .outcome { display: grid; grid-template-columns: 62px 1fr; gap: 3px 8px; font-size: 10.5px; margin-bottom: 4px; }
  .outcome .k { color: #8b949e; }
  .outcome .v { color: #e6edf3; }

  .wb-box { background: #071a0c; border: 1px solid #1a7f37; border-radius: 6px; padding: 9px 11px; font-size: 10px; line-height: 1.6; }
  .wb-box .item { color: #c9d1d9; padding: 1px 0; }
  .wb-box .item::before { content: "+ "; color: #3fb950; }
  .wb-box .item .p { color: #d2a8ff; }
  .wb-box .item .nt { color: #6e7681; }

  .placeholder { text-align: center; color: #484f58; padding: 16px; font-size: 12px; }
  .load-error { padding: 24px; color: #f85149; font-size: 12px; line-height: 1.7; }

  .cmp { width: 100%; border-collapse: collapse; font-size: 9.5px; margin-top: 6px; }
  .cmp th { background: #21262d; color: #8b949e; padding: 4px 5px; border: 1px solid #30363d; font-weight: 500; text-align: left; }
  .cmp tr > th:first-child { white-space: nowrap; }
  .cmp td { padding: 4px 5px; border: 1px solid #21262d; color: #c9d1d9; vertical-align: top; }
  .cmp td.on { background: #1c1014; color: #ffb3a0; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>Ontology Story Engine</h1>
    <span class="badge">케이팝 데몬 헌터스</span>
  </div>
  <div class="graph-area">
    <div id="network"></div>
  </div>
  <div class="sidebar">
    <div class="stats-bar">
      <div class="stat"><div class="n" id="s-nodes">-</div><div class="l">노드</div></div>
      <div class="stat"><div class="n" id="s-asserted">-</div><div class="l">명시 엣지</div></div>
      <div class="stat"><div class="n" id="s-derived">-</div><div class="l">추론</div></div>
      <div class="stat"><div class="n" id="s-seeds">-</div><div class="l">씨앗</div></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="seeds">씨앗</div>
      <div class="tab" data-tab="story">스토리</div>
    </div>
    <div id="panel-seeds" class="panel active">
      <div class="panel-scroll" id="seeds-list"></div>
    </div>
    <div id="panel-story" class="panel">
      <div class="panel-scroll" id="story-panel"><div class="placeholder">스토리 생성 버튼을 눌러주세요</div></div>
    </div>
  </div>
</div>

<script>
// 데이터는 전부 mock/ 에 있다. 이 파일은 렌더링만 한다.
//   mock/graph.json    노드와 엣지. 나중에 Neptune 쿼리로 바뀌는 자리 (issue #2)
//   mock/seeds.json    패턴 탐지기가 뽑은 씨앗. 나중에 탐지기 실행 결과로 바뀐다
//   mock/stories.json  씨앗별 분기 스토리. 나중에 Bedrock 생성 결과로 바뀐다
let WORLD = {nodes: [], edges: []};
let SEEDS = [];
let STORIES = [];

function buildNetwork() {
  const H = new Set();
  const nodes = new vis.DataSet(WORLD.nodes.map(n => {
    const colors = {Character:"#58a6ff",Faction:"#e3b341",Location:"#7ee787",Event:"#ffa657",Secret:"#d2a8ff"};
    return {
      id: n.id,
      label: n.name,
      color: {background: colors[n.kind]||"#58a6ff", border: colors[n.kind]||"#58a6ff"},
      font: {size: 12},
      size: n.kind==="Character" ? 22 : 14,
      shape: n.kind==="Secret" ? "diamond" : "dot"
    };
  }));

  const edges = new vis.DataSet(WORLD.edges.map(e => ({
    from: e.s,
    to: e.o,
    label: e.p,
    color: e.asserted ? "#e6edf3" : "#30363d",
    dashes: !e.asserted,
    font: {size: 9}
  })));

  const container = document.getElementById("network");
  const network = new vis.Network(container, {nodes, edges}, {
    physics: {stabilization: {iterations: 200}},
    interaction: {hover: true}
  });
}

function renderSeeds() {
  const html = SEEDS.map((s,i) => `
    <div class="seed-card">
      <div class="seed-meta">
        <span class="probe-tag">${s.probe}</span>
        <span class="seed-score">▲${s.score.toFixed(2)}</span>
      </div>
      <div class="seed-title">${s.title}</div>
      <div class="seed-rationale">${s.desc}</div>
      <button class="gen-btn" onclick="showStory(${i})">스토리 생성</button>
    </div>
  `).join("");
  document.getElementById("seeds-list").innerHTML = html;
}

let CUR = {seed: 0, branch: 0};

function showStory(i) {
  CUR = {seed: i, branch: 0};
  renderStory();
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab")[1].classList.add("active");
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById("panel-story").classList.add("active");
}

function selectBranch(bi) {
  CUR.branch = bi;
  renderStory();
}

function renderStory() {
  const seed = SEEDS[CUR.seed];
  const st = STORIES[CUR.seed];
  const b = st.branches[CUR.branch];

  const chips = st.branches.map((x,bi) => `
    <button class="branch-chip ${bi===CUR.branch?"on":""}" onclick="selectBranch(${bi})">
      <span class="bid">${x.id}</span>${x.label}
    </button>`).join("");

  const beats = b.beats.map((t,n) => `
    <div class="beat"><span class="no">${n+1}</span><span>${t}</span></div>`).join("");

  const outcome = Object.entries(b.outcome).map(([k,v]) => `
    <div class="outcome"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");

  const wbNodes = (b.writeback.nodes||[]).map(n => `
    <div class="item"><span class="nt">${n.kind}</span> ${n.name}
      ${n.t!==undefined?`<span class="p">t=${n.t}</span>`:""}
      <div class="p">${n.desc||""}</div></div>`).join("");

  const wbEdges = b.writeback.edges.map(e => `
    <div class="item"><span class="nt">edge</span>
      ${e.s} <b>${e.p}</b> ${e.o}${e.note?` <span class="p">(${e.note})</span>`:""}
    </div>`).join("");

  // 분기 비교표: 모든 분기의 결과 키를 합집합으로
  const keys = [...new Set(st.branches.flatMap(x => Object.keys(x.outcome)))];
  const cmp = `
    <table class="cmp">
      <tr><th></th>${st.branches.map(x=>`<th>${x.id}. ${x.label}</th>`).join("")}</tr>
      ${keys.map(k => `<tr><th>${k}</th>${st.branches.map((x,bi)=>
        `<td class="${bi===CUR.branch?"on":""}">${x.outcome[k]||"-"}</td>`).join("")}</tr>`).join("")}
      <tr><th>역기입 엣지</th>${st.branches.map((x,bi)=>
        `<td class="${bi===CUR.branch?"on":""}">${x.writeback.edges.length}개</td>`).join("")}</tr>
    </table>`;

  document.getElementById("story-panel").innerHTML = `
    <div class="story-content">
      <div class="seed-info">
        <span class="probe-tag">${seed.probe}</span>
        <span class="seed-score">▲${seed.score.toFixed(2)}</span>
        <span>초점: ${seed.focus.join(", ")}</span>
      </div>
      <h1>${st.title}</h1>
      <div class="logline">${st.logline}</div>

      <div class="pivot-box">
        <div class="ttl">${st.pivot.title}</div>
        <div class="bd">${st.pivot.body}</div>
      </div>

      <div class="sec-label">분기 ${st.branches.length}개</div>
      <div class="branch-chips">${chips}</div>

      <div class="branch-head">${b.id}. ${b.label}</div>
      <div class="branch-tone">${b.tone}</div>
      <div class="branch-premise">${b.premise}</div>

      <div class="sec-label">비트</div>
      <div class="beats">${beats}</div>

      <div class="sec-label">이 분기의 결과</div>
      ${outcome}

      <div class="sec-label">그래프 역기입</div>
      <div class="wb-box">${wbNodes}${wbEdges}</div>

      <div class="sec-label">분기 비교</div>
      ${cmp}
    </div>`;
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    document.getElementById("panel-"+t.dataset.tab).classList.add("active");
  };
});

function renderStats() {
  document.getElementById("s-nodes").textContent = WORLD.nodes.length;
  document.getElementById("s-asserted").textContent = WORLD.edges.filter(e=>e.asserted).length;
  document.getElementById("s-derived").textContent = WORLD.edges.filter(e=>!e.asserted).length;
  document.getElementById("s-seeds").textContent = SEEDS.length;
}

async function loadJson(name) {
  const res = await fetch(`mock/${name}`, {cache: "no-store"});
  if (!res.ok) throw new Error(`mock/${name} ${res.status}`);
  return res.json();
}

// 목데이터 셋을 한 번에 읽는다. 실제 구현에서는 graph가 Neptune 쿼리, seeds가 탐지기 실행,
// stories가 Bedrock 생성으로 각각 바뀌므로 여기서만 갈아끼우면 된다.
async function loadMock() {
  const [graph, seeds, stories] = await Promise.all([
    loadJson("graph.json"), loadJson("seeds.json"), loadJson("stories.json")
  ]);
  if (!Array.isArray(graph.nodes) || !Array.isArray(graph.edges)) throw new Error("graph.json: nodes/edges 배열이 없다");
  if (!Array.isArray(seeds) || !Array.isArray(stories)) throw new Error("seeds.json / stories.json: 배열이 아니다");
  if (seeds.length !== stories.length) throw new Error(`씨앗 ${seeds.length}개인데 스토리 ${stories.length}개다`);
  return {graph, seeds, stories};
}

loadMock().then(d => {
  WORLD = d.graph;
  SEEDS = d.seeds;
  STORIES = d.stories;
  renderStats();
  buildNetwork();
  renderSeeds();
}).catch(err => {
  document.getElementById("network").innerHTML =
    `<div class="load-error">목데이터를 불러오지 못했다: ${err.message}<br>파일 경로가 아니라 HTTP로 열어야 한다. 예: python3 -m http.server 8000 --directory demo</div>`;
  document.getElementById("seeds-list").innerHTML = `<div class="placeholder">데이터 로드 실패</div>`;
});
</script>
</body>
</html>
