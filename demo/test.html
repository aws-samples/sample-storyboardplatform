<!doctype html>
<meta charset="utf-8">
<title>core.js · graph-schema.js · graph-engine.js · graph-probes.js · story.js · graph-view.js 자체 검사</title>
<style>
  body { font: 14px/1.6 ui-monospace, Menlo, monospace; background: #16181C; color: #E8E4DA; padding: 32px; }
  .pass { color: #6FCF97 } .fail { color: #FF6B5E; font-weight: 700 }
  h1 { font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: #E3A93C }
</style>
<h1>core.js · graph-schema.js · graph-engine.js · graph-probes.js · story.js · graph-view.js 자체 검사</h1>
<pre id="out"></pre>
<script type="module">
  const {
    orderKeyBetween, orderKeyForIndex, canTransition, canEditContent, canMakeArt, ART_ROLES,
    canSeeAdmin, ADMIN_VIEW_ROLES,
    splitScenario, mergeField, handBackTo, notifFor, POSES, STATUS, TRANSITIONS,
    canPlan, normalizePlan, epLabel, CAMERAS,
    mentionsIn, sceneGroups, clock, startTimes, scrub, debounceBy,
    lostEdit, isActionable, changedSince, liveVer, deadVer,
    canGrantRole, workload, NEEDS, ROLES, ACTIONS,
    tally, stalls, retakes, flow, pace, actorPace, firstPass, reviewLag, fmtDur,
    normalizeGraph, validateAgainstCanon, mergeGraphs, normalizeStory, josa,
  } = await import(`./core.js?t=${Date.now()}`)
  const { GRAPH_SCHEMA, deriveEdges, romanizeId, edgeKey } = await import(`./graph-schema.js?t=${Date.now()}`)
  const { createGraphStore, loadGraphStore } = await import(`./graph-engine.js?t=${Date.now()}`)
  const { findSeeds, PROBES, probeSecretLeverage, probeLoveTriangle, probeUnresolvedTension,
    probeChekovObject, probeStrangersSharedPast, probeSeveredBond, probeContestedGoal,
    probeBetrayalPotential, probeIdentityCrisis, probeForbiddenBond, probePowerVacuum,
  } = await import(`./graph-probes.js?t=${Date.now()}`)
  const { extractGraphPrompt, scriptToText, chunkText, contextPackPrompt, branchPrompt,
    summarizePrompt, summarizeForExtraction, planGraph, planCuts,
    freeDirectionPrompt, localBranches, planBranches, planFreeBranches, parseJson,
    branchToSpec, branchOutlinePrompt, planBranchOutline, localBranchOutline,
    applyWriteback, validateWritebackBeforeApply,
    scriptFormatPrompt, planScript, localScript, scriptBlob, scriptFileName, SCRIPT_FORMATS,
  } = await import(`./story.js?t=${Date.now()}`)
  const { edgeLabel, graphDelta, EDGE_LABELS_KR } = await import(`./graph-view.js?t=${Date.now()}`)
  const { parseField, runPlanJob, PLAN_TIMEOUT_MS } = await import(`./net.js?t=${Date.now()}`)
  const { NAV_TABS, navTab, navHref, isSoonTab, navTabFromSearch, soonMarkup, mountNav,
  } = await import(`./nav-tabs.js?t=${Date.now()}`)

  const out = document.getElementById('out')
  let failed = 0
  const ok = (name, cond, extra = '') => {
    if (!cond) failed++
    out.insertAdjacentHTML('beforeend',
      `<span class="${cond ? 'pass' : 'fail'}">${cond ? 'PASS' : 'FAIL'}</span>  ${name}${extra ? '  ' + extra : ''}\n`)
  }

  ok('빈 보드의 첫 키', typeof orderKeyBetween(null, null) === 'string')
  ok('a < mid < b', (() => {
    const m = orderKeyBetween('A', 'B')
    return 'A' < m && m < 'B'
  })())
  ok('접두 관계도 처리 (A < A5)', (() => {
    const m = orderKeyBetween('A', 'A5')
    return 'A' < m && m < 'A5'
  })())
  ok('틈 없는 인접 키 사이 (0 < 1)', (() => {
    const m = orderKeyBetween('0', '1')
    return '0' < m && m < '1'
  })())
  ok('맨 앞 삽입', (() => { const m = orderKeyBetween(null, 'A'); return m < 'A' })())
  ok('맨 뒤 삽입', (() => { const m = orderKeyBetween('A', null); return m > 'A' })())

  ok('같은 위치 200회 삽입 후에도 순서 유지', (() => {
    let lo = orderKeyBetween(null, null)
    let hi = orderKeyBetween(lo, null)
    const inserted = []
    for (let i = 0; i < 200; i++) {
      const m = orderKeyBetween(lo, hi)
      if (!(lo < m && m < hi)) return false
      inserted.push(m)
      hi = m
    }
    const sorted = [...inserted].sort()
    return sorted.join() === [...inserted].reverse().join()
  })())

  ok('임의 위치 200회 삽입 후 전체 정렬 무결', (() => {
    const keys = []
    let seed = 42
    const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648
    for (let i = 0; i < 200; i++) {
      const at = Math.floor(rnd() * (keys.length + 1))
      keys.splice(at, 0, orderKeyForIndex(keys, at))
    }
    return keys.every((k, i) => i === 0 || keys[i - 1] < k) && new Set(keys).size === keys.length
  })())

  ok('역순 인자는 거부', (() => {
    try { orderKeyBetween('B', 'A'); return false } catch { return true }
  })())

  ok('감독은 리뷰 대기 컷을 승인', canTransition('director', 'in_review', 'approve').ok)
  ok('승인 결과 상태는 approved', canTransition('director', 'in_review', 'approve').to === 'approved')
  ok('아티스트는 승인 불가', !canTransition('artist', 'in_review', 'approve').ok)
  ok('리뷰어는 수정 요청 가능', canTransition('reviewer', 'in_review', 'request_changes').ok)
  ok('작업 중인 컷은 승인 불가', !canTransition('director', 'in_progress', 'approve').ok)
  ok('수정 요청 후 작업 재개', canTransition('artist', 'changes_requested', 'resume').to === 'in_progress')
  ok('승인된 컷은 감독만 되돌림', canTransition('director', 'approved', 'reopen').ok && !canTransition('artist', 'approved', 'reopen').ok)
  ok('모든 전이 결과가 알려진 상태', Object.values(TRANSITIONS)
    .flatMap((m) => Object.entries(m))
    .every(([from, to]) => STATUS[from] && STATUS[to]))
  ok('승인된 컷은 내용 편집 잠금', !canEditContent('artist', { status: 'approved' }))
  ok('리뷰어는 내용 편집 불가', !canEditContent('reviewer', { status: 'in_progress' }))

  ok('그림은 아티스트와 기획만 만든다', canMakeArt('artist') && canMakeArt('planner'))
  ok('감독·리뷰어·관리자는 그림을 만들지 않는다',
    !['director', 'reviewer', 'admin', undefined, 'admin"'].some(canMakeArt))
  ok('감독은 그림은 못 만들어도 컷 글은 고친다',
    !canMakeArt('director') && canEditContent('director', { status: 'in_progress' }))
  ok('그림 권한 목록의 역할은 모두 이름을 가진다', ART_ROLES.every((r) => ROLES[r]))

  ok('관리 화면은 감독만 연다', canSeeAdmin('director'))
  ok('기획·아티스트·리뷰어·관리자는 관리 화면을 못 연다',
    !['planner', 'artist', 'reviewer', 'admin', undefined, 'director"'].some(canSeeAdmin))
  ok('여는 권한과 역할 지정 권한은 따로다',
    canSeeAdmin('director') && !canGrantRole('director') && canGrantRole('admin') && !canSeeAdmin('admin'))
  ok('관리 화면 권한 목록의 역할은 모두 이름을 가진다', ADMIN_VIEW_ROLES.every((r) => ROLES[r]))

  ok('관리자만 남의 역할을 정한다',
    canGrantRole('admin') && !['director', 'planner', 'artist', 'reviewer', undefined].some(canGrantRole))
  ok('담당 지정은 관리자도 할 수 있다', canTransition('admin', 'draft', 'assign').ok)
  ok('모든 역할이 이름을 가진다',
    [...new Set(Object.values(ACTIONS).flatMap((a) => a.roles))].every((r) => ROLES[r]))
  ok('역할을 받는 사람 id도 모양으로 자른다',
    scrub({ userId: 'u2" onerror="x' }).userId === '' && scrub({ userId: 'u2' }).userId === 'u2')

  const LOAD = [
    { id: 'c1', assignee: 'u2', status: 'in_progress' },
    { id: 'c2', assignee: 'u2', status: 'in_review' },
    { id: 'c3', assignee: 'u2', status: 'approved' },
    { id: 'c4', assignee: null, status: 'draft' },
    { id: 'c5', assignee: 'u9', status: 'changes_requested' },
  ]
  const W = workload(LOAD, ['u1', 'u2'])
  ok('승인된 컷은 진행 중에서 빠진다', W.u2.open === 2 && W.u2.approved === 1)
  ok('진행 중 목록은 남은 컷만', W.u2.cuts.map((p) => p.id).join() === 'c1,c2')
  ok('상태별로도 센다', W.u2.by.in_review === 1 && W.u2.by.approved === 1)
  ok('일이 없는 사람도 표에 남는다', W.u1 && W.u1.open === 0 && W.u1.cuts.length === 0)
  ok('담당 없는 컷은 아무에게도 안 얹힌다',
    !Object.values(W).some((w) => w.cuts.some((p) => p.id === 'c4')))
  ok('명부에 없는 담당자도 빠지지 않는다', W.u9?.open === 1)
  ok('빈 보드도 죽지 않는다', Object.keys(workload([], [])).length === 0 && workload(null).u1 === undefined)

  const need = (k) => LOAD.filter(NEEDS[k].hit).map((p) => p.id).join()
  ok('담당 없음은 승인 안 된 무담당 컷', need('unassigned') === 'c4')
  ok('리뷰 대기는 상태로 고른다', need('in_review') === 'c2')
  ok('진행 중은 승인만 뺀다', need('open') === 'c1,c2,c4,c5')
  ok('전체는 전체다', need('all') === LOAD.map((p) => p.id).join())
  ok('모든 잣대에 이름과 규칙이 있다',
    Object.values(NEEDS).every((n) => n.label && typeof n.hit === 'function'))

  const HOUR = 36e5
  const AT = 1750000000000
  const DAY0 = Math.floor(AT / 864e5) * 864e5
  const BOARD = [
    { id: 'c1', charId: null, secs: 4, assignee: 'u2', status: 'approved', _ts: { status: DAY0 } },
    { id: 'c2', charId: null, secs: 6, assignee: 'u2', status: 'in_review', _ts: { status: DAY0 } },
    { id: 'c3', charId: null, secs: 5, assignee: null, status: 'draft', _ts: { action: DAY0 } },
    { id: 'c4', charId: 'ch1', assignee: 'u2', status: 'approved', _ts: { status: DAY0 } },
  ]
  const EV = [
    { panelId: 'c1', from: 'draft', to: 'in_progress', actor: 'u2', ts: DAY0 + 1 * HOUR },
    { panelId: 'c1', from: 'in_progress', to: 'in_review', actor: 'u2', ts: DAY0 + 2 * HOUR },
    { panelId: 'c1', from: 'in_review', to: 'changes_requested', actor: 'u3', ts: DAY0 + 3 * HOUR },
    { panelId: 'c1', from: 'changes_requested', to: 'in_progress', actor: 'u2', ts: DAY0 + 3 * HOUR },
    { panelId: 'c1', from: 'in_progress', to: 'in_review', actor: 'u2', ts: DAY0 + 4 * HOUR },
    { panelId: 'c1', from: 'in_review', to: 'approved', actor: 'u3', ts: DAY0 + 5 * HOUR },
    { panelId: 'c2', from: 'in_progress', to: 'in_review', actor: 'u2', ts: DAY0 + 2 * HOUR },
  ]
  const T = tally(BOARD)
  ok('컷 수와 단계별 수', T.n === 4 && T.byStatus.approved === 2 && T.byStatus.in_review === 1)
  ok('담당 없음은 NEEDS와 같은 잣대', T.unassigned === BOARD.filter(NEEDS.unassigned.hit).length)
  ok('분량은 보드 컷만 센다 (인물 구도 제외)', T.secs === 15 && T.secsDone === 4)

  const S = stalls(BOARD, EV, DAY0 + 6 * HOUR)
  ok('오래 멈춘 컷이 앞에 온다', S.map((x) => x.p.id).join() === 'c3,c4,c2,c1')
  ok('마지막 기록으로 잰다', S.find((x) => x.p.id === 'c2').secs === 4 * 3600
    && S.find((x) => x.p.id === 'c1').secs === 1 * 3600)
  ok('단계 기록이 없으면 컷이 바뀐 시각으로 잰다', S.find((x) => x.p.id === 'c3').secs === 6 * 3600)
  ok('경과가 숫자가 아니면 안 된다', S.every((x) => Number.isFinite(x.secs)))
  ok('그것도 없으면 known=false', stalls([{ id: 'x', status: 'draft' }], [], AT)[0].known === false)

  ok('재작업은 수정 요청으로 떨어진 횟수', retakes(EV).c1 === 1 && retakes(EV).c2 === undefined)

  const F = flow(EV)
  ok('되돌아간 이동만 back으로 센다', F.back === 1 && F.fwd === 6)
  ok('같은 이동은 한 줄로 묶인다', F.pairs[0].from === 'in_progress' && F.pairs[0].to === 'in_review' && F.pairs[0].n === 3)
  ok('수정 요청은 뒤로 간 것으로 본다', F.pairs.find((r) => r.to === 'changes_requested').back === true)

  const P = pace(EV, DAY0 + 6 * HOUR)
  ok('한 칸이 한 시간, 첫 기록부터 지금까지', P.cols.length === 6 && P.total === EV.length)
  ok('아무것도 없던 시간도 칸을 차지한다', P.cols[1].n === 2 && P.cols[5].n === 0)
  ok('셈은 칸의 합과 같다', P.total === P.cols.reduce((s, c) => s + c.n, 0))
  ok('어제 기록은 오늘 칸에 섞이지 않는다',
    pace([{ panelId: 'c1', to: 'approved', ts: DAY0 - HOUR }], DAY0 + HOUR).cols.length === 0)
  ok('시계가 앞선 op도 칸을 받는다', (() => {
    const skew = pace([{ panelId: 'c1', to: 'x', ts: DAY0 + 3 * HOUR }], DAY0 + HOUR)
    return skew.cols.length === 1 && skew.cols[0].n === 1
  })())

  ok('오늘 누가 옮겼는지', actorPace(EV, AT).u2.n === 5 && actorPace(EV, AT).u3.n === 2)

  const FP = firstPass(BOARD, EV)
  ok('한 번에 통과: 되돌아온 컷은 빠진다', FP.total === 2 && FP.clean === 1)
  ok('승인이 없으면 0%가 아니라 표본이 0이다', firstPass([], EV).total === 0)
  ok('리뷰→승인 중간값', reviewLag(BOARD, EV) === 3 * 3600)
  ok('기록이 없으면 null (0이 아니다)', reviewLag(BOARD, []) === null)
  ok('빈 판에서도 죽지 않는다',
    tally().n === 0 && stalls().length === 0 && flow().fwd === 0 && pace([], AT).cols.length === 0)
  ok('경과는 사람 말로', fmtDur(30) === '방금' && fmtDur(600) === '10분' && fmtDur(7200) === '2시간' && fmtDur(864e2 * 2) === '2일')

  const EVENTS = [
    { panelId: 'p1', to: 'in_review', actor: 'artistA' },
    { panelId: 'p2', to: 'in_review', actor: 'artistB' },
    { panelId: 'p1', to: 'approved', actor: 'director' },
  ]
  ok('수정 요청은 리뷰를 올린 사람에게 돌아감', handBackTo(EVENTS, 'p1', 'director') === 'artistA')
  ok('다른 컷의 기록에 오염되지 않음', handBackTo(EVENTS, 'p2', 'director') === 'artistB')
  ok('기록이 없으면 현재 담당 유지', handBackTo(EVENTS, 'p9', 'director') === 'director')

  const PEOPLE = [
    { id: 'u1', name: '김하나' }, { id: 'u2', name: '이도현' },
    { id: 'u3', name: '박서준' }, { id: 'u4', name: '최유진' },
  ]
  const cmtOp = (author, body = '메모', extra = {}) =>
    ({ kind: 'comment.add', comment: { author, body, ...extra } })
  const to = (op, panel, ctx) => notifFor(op, panel, ctx).map((n) => `${n.to}:${n.kind}`)

  ok('메모는 담당자에게 알림', to(cmtOp('u3'), { assignee: 'u2' }).join() === 'u2:comment')
  ok('담당자 본인의 메모는 알림 없음', to(cmtOp('u2'), { assignee: 'u2' }).length === 0)
  ok('담당 없는 컷의 메모는 알림 없음', to(cmtOp('u3'), { assignee: null }).length === 0)
  ok('상태 변경은 새 담당자에게 알림',
    to({ kind: 'panel.status', assignee: 'u2', actor: 'u3' }, {}).join() === 'u2:status')
  ok('내가 내 담당으로 가져오면 알림 없음',
    to({ kind: 'panel.status', assignee: 'u2', actor: 'u2' }, {}).length === 0)
  ok('편집은 알림을 만들지 않음', to({ kind: 'panel.patch' }, { assignee: 'u2' }).length === 0)
  ok('내용 편집은 담당자에게도 알림 없음',
    to({ kind: 'panel.patch', fields: { action: '수정' }, actor: 'u3' }, { assignee: 'u2' }).length === 0)
  ok('담당 지정은 새 담당자에게 알림',
    to({ kind: 'panel.patch', fields: { assignee: 'u2' }, actor: 'u3' }, {}).join() === 'u2:assign')
  ok('담당을 비우면 알림 없음',
    to({ kind: 'panel.patch', fields: { assignee: null }, actor: 'u3' }, { assignee: 'u2' }).length === 0)

  ok('이름이 불린 사람에게 알림',
    to(cmtOp('u3', '@김하나 이 컷 순서 맞나요?'), { assignee: null }, { people: PEOPLE })
      .join() === 'u1:mention')
  ok('멘션과 담당자에게 각각 알림',
    to(cmtOp('u3', '@김하나 확인 부탁'), { assignee: 'u2' }, { people: PEOPLE })
      .join() === 'u1:mention,u2:comment')
  ok('담당자를 멘션해도 알림은 하나',
    to(cmtOp('u3', '@이도현 여기 봐주세요'), { assignee: 'u2' }, { people: PEOPLE })
      .join() === 'u2:mention')
  ok('자기를 언급해도 알림 없음',
    to(cmtOp('u3', '@박서준 메모'), { assignee: null }, { people: PEOPLE }).length === 0)
  ok('답글은 원 메모를 쓴 사람에게',
    to(cmtOp('u2', '고쳤습니다', { parentId: 'c1' }), { assignee: 'u2' }, { parentAuthor: 'u3' })
      .join() === 'u3:reply')
  ok('없는 이름은 멘션이 아님',
    to(cmtOp('u3', '@홍길동 봐주세요'), { assignee: null }, { people: PEOPLE }).length === 0)
  ok('긴 이름을 짧은 이름으로 오인하지 않음',
    mentionsIn('@김하나 봐주세요', [{ id: 'a', name: '김하' }, { id: 'b', name: '김하나' }]).join() === 'b')

  const CUTS = [
    { id: 1, scene: '씬 1', secs: 2.5 }, { id: 2, scene: '씬 1', secs: 1.5 },
    { id: 3, scene: '씬 2', secs: 2 }, { id: 4, scene: '씬 1', secs: 1 },
  ]
  ok('붙어 있는 같은 씬만 묶임', sceneGroups(CUTS).map((g) => g.cuts.length).join() === '2,1,1')
  ok('씬 길이는 컷 길이의 합', sceneGroups(CUTS)[0].secs === 4)
  ok('씬 없는 컷도 한 덩어리', sceneGroups([{ id: 1 }, { id: 2 }]).length === 1)
  ok('빈 목록은 씬 없음', sceneGroups([]).length === 0)
  ok('초는 분:초로 표시', clock(0) === '0:00' && clock(75) === '1:15' && clock(2.5) === '0:03')

  ok('시작 시각은 앞 컷들의 합', (() => {
    const s = startTimes(CUTS)
    return s[1] === 0 && s[2] === 2.5 && s[3] === 4 && s[4] === 6
  })())
  ok('길이 없는 컷도 자리를 차지하지 않는다',
    startTimes([{ id: 'a' }, { id: 'b', secs: 2 }, { id: 'c' }]).c === 2)
  ok('빈 보드는 빈 표', Object.keys(startTimes([])).length === 0)

  ok('구도 슬롯은 중복 없음', new Set(POSES).size === POSES.length && POSES.length >= 4)

  ok('늦게 도착한 옛 편집은 새 편집을 덮지 않음', (() => {
    const p = {}
    mergeField(p, 'action', '새 내용', 200)
    mergeField(p, 'action', '옛 내용', 100)
    return p.action === '새 내용'
  })())
  ok('최신 편집은 반영됨', (() => {
    const p = {}
    mergeField(p, 'action', 'v1', 100)
    mergeField(p, 'action', 'v2', 300)
    return p.action === 'v2'
  })())

  const applyVer = (p, op) => {
    if (op.kind === 'panel.version') {
      p.versions = [...(p.versions || []), { ...op.version, vid: op.id }]
      if (!p.dead?.[op.id]) mergeField(p, 'current', p.versions.length - 1, op.ts)

  // 받아 적는 가짜 net 을 넣어, 조회는 그대로인지·보내는 것이 맞는지만 본다.
  const fakeNet = (graph = { nodes: [], edges: [] }, { fail = false } = {}) => {
    const sent = []
    const call = (op) => async (payload) => {
      sent.push({ op, payload })
      if (fail) throw new Error('연결 끊김')
      return op === 'load' ? graph : {}
    }
    return {
      sent,
      load: async (projectId) => { sent.push({ op: 'load', payload: { projectId } }); return graph },
      save: call('save'),
      update: call('update'),
      query: call('query'),
    }
  }

  ok('Neptune 판도 조회 결과가 인메모리 판과 같다', (() => {
    const mem = createGraphStore(twoChars)
    const nep = createGraphStore(twoChars, { net: fakeNet() })
    return JSON.stringify(mem.stats()) === JSON.stringify(nep.stats())
      && JSON.stringify(mem.toJSON()) === JSON.stringify(nep.toJSON())
      && mem.getEdgesFrom('a').length === nep.getEdgesFrom('a').length

    const r = st.addNodes([{ kind: 'Object', name: '낡은 열쇠' }])
    // Promise 가 아니라 인메모리 판과 같은 {added, warnings} 가 그대로 나온다
    return Array.isArray(r.added) && r.added.length === 1 && st.stats().nodes === 2
  })())

  // plan 리졸버는 8000자를 넘는 프롬프트를 BadRequest 로 튕기고, AppSync 는 30초를
  // 넘긴 호출에 Execution timeout 을 낸다. 두 상한을 여기서 못 박는다 —
  // 그래프가 커지면 컨텍스트 팩이 먼저 접히고, 출력 모양·규칙은 손대지 않는다.
  const PROMPT_MAX = 8000
  const bigStore = (() => {
    const long = '아주 긴 설명을 문단째로 물고 온 desc 다. '.repeat(12)
    const nodes = []
    const edges = []
    for (let i = 0; i < 40; i++) {
      nodes.push(N(`c${i}`, 'Character', `인물${i}`, { age: 20 + (i % 30), role: `역할 ${i}`, desc: long }))
    }
    for (let i = 0; i < 12; i++) nodes.push(N(`s${i}`, 'Secret', `비밀${i}`, { claim: long }))
    for (let i = 0; i < 12; i++) nodes.push(N(`e${i}`, 'Event', `사건${i}`, { t: -i, desc: long }))
    const P = ['loves', 'trusts', 'serves', 'protects', 'owes', 'suspects']
    for (let i = 0; i < 40; i++) {
      for (let k = 0; k < 4; k++) {
        edges.push(E(`c${i}`, P[k % P.length], `c${(i + k + 1) % 40}`,
          { tension: 0.7, cause: '근거를 길게 적었다 '.repeat(5) }))
      }
    }
    for (let i = 0; i < 12; i++) {
      edges.push(E(`c${i}`, 'conceals', `s${i}`), E(`s${i}`, 'hidden_from', `c${i + 1}`),
        E(`c${i + 2}`, 'knows', `s${i}`), E(`c${i}`, 'participated_in', `e${i}`))
    }
    return createGraphStore(G(nodes, edges))
  })()
  const bigSeeds = findSeeds(bigStore)

  // planBranches·planFreeBranches 가 실제로 보내는 {prompt, maxTokens, think} 를 받아 적는다
  const sentPrompts = await (async () => {
    const sent = []
    const net = { plan: async (spec) => { sent.push(spec); return { text: '{"title":"t","logline":"l","branches":[]}' } } }
    for (const s of bigSeeds.slice(0, 6)) await planBranches(net, s, bigStore)
    const dir = '기획자가 방향을 아주 길게 적었다. '.repeat(200)
    for (const s of bigSeeds.slice(0, 3)) await planFreeBranches(net, dir, s, bigStore)
    await planFreeBranches(net, dir, null, bigStore)
    return sent
  })()
  const longest = Math.max(...sentPrompts.map((x) => x.prompt.length))

  ok('큰 그래프에서도 보내는 프롬프트가 8000자를 넘지 않는다',
    sentPrompts.length === 10 && sentPrompts.every((x) => x.prompt.length <= PROMPT_MAX),
    `최장 ${longest}자`)
  ok('긴 자유 방향을 받아도 프롬프트 상한을 지킨다', (() => {
    const free = sentPrompts.slice(6)
    return free.length === 4 && free.every((x) => x.prompt.length <= PROMPT_MAX
      && x.prompt.includes('[기획자의 방향]'))
  })())
  ok('프롬프트를 줄여도 출력 모양과 규칙은 그대로 남는다',
    sentPrompts.every((x) => x.prompt.includes('"remove_edges"') && x.prompt.includes('정확히 3개')
      && x.prompt.includes('- 한국어로 쓴다.')))
  ok('분기 응답 토큰은 2000 으로 묶는다 — 30초 안에 끝나야 한다',
    sentPrompts.every((x) => x.maxTokens === 2000 && x.think === false))
  ok('컨텍스트 팩은 준 예산에 맞춰 줄을 접는다', (() => {
    const dflt = contextPackPrompt(bigSeeds[0], bigStore)
    const tight = contextPackPrompt(bigSeeds[0], bigStore, { limit: 1200 })
    // 씨앗·결함·규모와 블록마다 남기는 최소 줄은 예산보다 우선한다. 그래도 크게 줄어든다
    return tight.length < dflt.length && tight.length < 2000
      && tight.includes('[씨앗]') && tight.includes('[전체 규모]')
      && tight.includes('줄 더 있지만 생략했다')
  })(), `기본 ${contextPackPrompt(bigSeeds[0], bigStore).length}자 → 예산 1200 에서 ${contextPackPrompt(bigSeeds[0], bigStore, { limit: 1200 }).length}자`)
  ok('추출 프롬프트도 8000자를 넘지 않는다 — 조각이 길면 글만 자른다', (() => {
    const known = bigStore.getNodes().map((n) => ({ id: n.id, kind: n.kind, name: n.name }))
    const p = extractGraphPrompt('가'.repeat(6000), { known, part: { i: 1, n: 3 }, title: '제목' })
    return p.length <= PROMPT_MAX && p.includes('(글이 길어 여기서 잘랐다)')
      && GRAPH_SCHEMA.assertableRels.every((r) => p.includes(r))
  })())
  ok('추출 조각 하나는 프롬프트에 통째로 들어간다', (() => {
    const known = bigStore.getNodes().slice(0, 20).map((n) => ({ id: n.id, kind: n.kind, name: n.name }))
    return chunkText('가'.repeat(20000)).every((c) => {
      const p = extractGraphPrompt(c, { known, part: { i: 1, n: 7 } })
      return p.length <= PROMPT_MAX && !p.includes('잘랐다') && p.includes(c)
    })
  })())
  ok('요약 프롬프트도 8000자를 넘지 않는다 — 대본이 길면 대본만 자른다', (() => {
    const p = summarizePrompt('가'.repeat(20000), { title: '제목' })
    return p.length <= PROMPT_MAX && p.includes('(대본이 길어 여기서 잘랐다)')
      && p.includes('요약문만 출력한다') && p.includes('- 한국어로 쓴다.')
  })())
  ok('요약 조각 하나는 프롬프트에 통째로 들어간다', (() => {
    // 6000 = story.js 의 SUMMARY_CHUNK. 조각 하나가 잘리면 요약이 앞부분만 보게 된다
    const c = '가'.repeat(6000)
    const p = summarizePrompt(c, { title: '제목', part: { i: 1, n: 4 } })
    return p.length <= PROMPT_MAX && !p.includes('잘랐다') && p.includes(c)
  })())
  ok('판에 노드가 많아도 기존 노드 목록은 40줄에서 접는다', (() => {
    const known = Array.from({ length: 90 }, (_, i) => ({ id: `n${i}`, kind: 'Character', name: `인물${i}` }))
    const p = extractGraphPrompt('짧은 글', { known })
    return p.includes('- (그 외 50개는 생략했다)') && !p.includes('- n80 (Character) 인물80')
  })())

  // ── nav-tabs.js: 상단 기능 탭 ──────────────────────────────────────────────
  // 두 화면(index.html · story-graph.html)이 이 한 벌을 나눠 쓴다. 탭이 늘거나
  // 이동 주소가 어긋나면 여기서 걸린다.
  ok('탭은 다섯이고 순서가 정해져 있다',
    NAV_TABS.map((t) => t.id).join(',') === 'board,develop,script,translate,keyvisual')
  ok('탭마다 이름과 한 줄 설명이 있다', NAV_TABS.every((t) => t.label && t.desc))
  ok('키비주얼까지 네 탭은 갈 곳이 있고, 대본 번역만 준비 중이다', (() => {
    const go = NAV_TABS.filter((t) => t.href).map((t) => t.id).join(',')
    const later = NAV_TABS.filter((t) => t.soon).map((t) => t.id).join(',')
    return go === 'board,develop,script,keyvisual' && later === 'translate'
  })())
  ok('대본화는 story-graph 의 안쪽 대본화 탭으로 데려간다',
    navTab('script').href === './story-graph.html?tab=script')
  ok('디벨롭은 파라미터 없이 story-graph 로 간다', navTab('develop').href === './story-graph.html')
  /*
   * 키 비주얼만 루트 기준 절대경로다. 배포에서 이 탭 바는 /index.html 과
   * /demo/index.html 두 곳에서 그려지는데, './key-visual/' 로 두면 후자에서
   * /demo/key-visual/ 을 찾아 404 가 된다.
   */
  ok('키비주얼은 어느 폴더에서 그려도 같은 곳으로 간다', navTab('keyvisual').href === '/key-visual/')
  ok('준비 중은 대본 번역뿐이다',
    isSoonTab('translate') && !isSoonTab('keyvisual') && !isSoonTab('board'))
  /*
   * 화면이 없는 탭도 링크로 그려질 수 있다 — 키 비주얼처럼 그 탭을 handled 에 넣지
   * 않는 화면에서다. href 가 없으니 그대로 <a> 로 만들면 주소가 undefined 가 되어
   * /key-visual/undefined 같은 곳으로 간다. navHref 가 보드로 돌려보내고, 보드가
   * ?tab= 을 읽어 준비 중 안내를 띄운다.
   */
  ok('갈 곳이 있는 탭은 자기 주소를 쓴다', navHref('keyvisual') === '/key-visual/'
    && navHref('script') === './story-graph.html?tab=script')
  ok('준비 중 탭은 보드로 보내고 보드가 안내를 띄운다',
    navHref('translate') === '/index.html?tab=translate')
  ok('보드는 그 주소로 안내 탭을 켠다', navTabFromSearch('?tab=translate', 'board') === 'translate')
  ok('?tab=script 는 대본화로 읽는다', navTabFromSearch('?tab=script', 'develop') === 'script')
  ok('모르는 tab 값은 기본 탭으로 떨어진다', navTabFromSearch('?tab=없는것', 'develop') === 'develop')
  ok('파라미터가 없으면 기본 탭', navTabFromSearch('', 'board') === 'board'
    && navTabFromSearch(undefined, 'board') === 'board')
  ok('? 없이 넘겨도 읽는다', navTabFromSearch('tab=keyvisual', 'board') === 'keyvisual')
  ok('준비 중 안내에 문구가 다 들어 있다', (() => {
    const html = soonMarkup('translate')
    return html.includes('준비 중입니다') && html.includes('이 기능은 곧 추가됩니다')
      && html.includes('대본 번역')
  })())

  ok('탭 바는 내가 처리할 탭만 버튼으로, 나머지는 링크로 그린다', (() => {
    const mount = document.createElement('div')
    document.body.appendChild(mount)
    const picked = []
    const nav = mountNav({
      mount, active: 'develop',
      handled: ['develop', 'script', 'translate', 'keyvisual'],
      onSelect: (id) => picked.push(id),
    })
    const at = (id) => mount.querySelector(`[data-nav="${id}"]`)
    const shape = at('board').tagName === 'A' && at('board').getAttribute('href').endsWith('index.html')
      && at('script').tagName === 'BUTTON'
    const on = at('develop').getAttribute('aria-current') === 'page'
      && at('script').getAttribute('aria-current') === null
    at('keyvisual').click()
    const moved = picked.join(',') === 'keyvisual'
      && at('keyvisual').getAttribute('aria-current') === 'page'
      && at('develop').getAttribute('aria-current') === null
    nav.setActive('script')
    const synced = nav.active() === 'script' && at('script').getAttribute('aria-current') === 'page'
    mount.remove()
    return shape && on && moved && synced
  })())

  // ── net.js: AWSJSON 필드 풀기 ─────────────────────────────────────────────
  // 배포된 리졸버들은 JSON.stringify 한 문자열을 AWSJSON 으로 내보내고 AppSync 가 한 번 더
  // 감싼다. plan 응답이 '"{\"text\":...}"' 로 오던 자리다 — 한 번만 풀면 문자열이 남는다.
  const planBody = { text: '{"title":"제목"}', usage: { inputTokens: 10 }, stop: 'end_turn' }

  ok('이중 직렬화된 plan 응답을 값으로 푼다', (() => {
    const wire = JSON.stringify(JSON.stringify(planBody))
    const got = parseField(wire)
    return got.text === planBody.text && got.stop === 'end_turn' && got.usage.inputTokens === 10
  })())
  ok('한 번만 직렬화돼 와도 같은 값이 나온다 — 리졸버를 고쳐도 그대로 맞는다', (() => {
    const got = parseField(JSON.stringify(planBody))
    return got.text === planBody.text && got.stop === 'end_turn'
  })())
  ok('이미 객체로 온 필드는 그대로 준다', parseField(planBody).text === planBody.text)
  ok('이중 직렬화된 그래프도 푼다', (() => {
    const g = { nodes: [{ id: 'a', kind: 'Character', name: '가온' }], edges: [] }
    const got = parseField(JSON.stringify(JSON.stringify(g)))
    return got.nodes.length === 1 && got.nodes[0].name === '가온'
  })())
  ok('배열로 온 필드도 한 겹 더 푼다', (() => {
    const got = parseField(JSON.stringify(JSON.stringify([1, 2, 3])))
    return Array.isArray(got) && got.length === 3
  })())
  ok('값이 진짜 문자열이면 다시 풀지 않는다 — 타입이 바뀌면 안 된다', (() => {
    // '42' 를 한 번 더 풀면 숫자 42 가 된다. 여는 괄호로 시작할 때만 두 번 푼다
    return parseField(JSON.stringify('42')) === '42'
      && parseField(JSON.stringify('S#1. 빵집 - 낮')) === 'S#1. 빵집 - 낮'
      && parseField(JSON.stringify('true')) === 'true'
  })())
  ok('두 번째 파싱이 깨지면 문자열을 그대로 준다', parseField(JSON.stringify('{깨진 JSON')) === '{깨진 JSON')

  // ── net.js: 비동기 plan (30초 상한 우회) ──────────────────────────────────
  // AppSync 요청 실행 시간 상한은 30초이고 상향이 불가다. 그래서 plan 은 mutation 으로
  // 잡을 띄우고 planResult(jobId) 를 폴링한다. story.js 의 호출부는 그대로여야 하므로
  // 돌려주는 모양({text, usage, stop})을 여기서 못 박는다.
  const FAST = { pollMs: 1, timeoutMs: 300 }
  // 리졸버가 JSON.stringify 한 것을 AppSync 가 한 번 더 감싼다
  const asWire = (v) => JSON.stringify(JSON.stringify(v))
  // pending 을 n 번 준 뒤 last 를 주는 가짜 서버
  const fakePlanServer = (n, last, jobId = 'job-1') => {
    const seen = { queries: [], polls: 0, spec: null }
    const post = async (query, variables) => {
      seen.queries.push(query.trim().split('(')[0])
      if (query.startsWith('mutation')) {
        seen.spec = JSON.parse(variables.spec)
        return { plan: { jobId, status: 'pending' } }
      }
      seen.polls++
      return { planResult: asWire(seen.polls <= n ? { status: 'pending' } : last) }
    }
    return { post, seen }
  }

  ok('plan 은 mutation 으로 띄우고 planResult 를 폴링한다', await (async () => {
    const { post, seen } = fakePlanServer(2, {
      status: 'done', text: '{"title":"제목"}', usage: { outputTokens: 7 }, stop: 'end_turn',
    })
    const got = await runPlanJob(post, { prompt: '충분히 긴 프롬프트다', model: 'opus-4.8' }, FAST)
    return got.text === '{"title":"제목"}' && got.stop === 'end_turn' && got.usage.outputTokens === 7
      && seen.polls === 3 && seen.queries[0] === 'mutation Plan'
      && seen.queries.slice(1).every((q) => q === 'query PlanResult')
      // spec 은 손대지 않고 그대로 실려 나가야 한다 — 모델 선택이 여기서 죽으면 안 된다
      && seen.spec.model === 'opus-4.8'
  })())
  ok('pending 이 계속 와도 끝난 뒤에만 값을 준다 — story.js 는 await 만 한다', await (async () => {
    const { post } = fakePlanServer(5, { status: 'done', text: 'S#1. 빵집 - 낮', usage: {}, stop: 'end_turn' })
    // 진짜 문자열인 text 가 한 겹 더 풀려 타입이 바뀌지 않아야 한다
    return (await runPlanJob(post, { prompt: '충분히 긴 프롬프트다' }, FAST)).text === 'S#1. 빵집 - 낮'
  })())
  ok('Lambda 가 적은 error 결과는 예외로 올라온다', await (async () => {
    const { post } = fakePlanServer(1, { status: 'error', error: 'Bedrock AccessDeniedException' })
    try { await runPlanJob(post, { prompt: '충분히 긴 프롬프트다' }, FAST); return false }
    catch (e) { return e.message === 'Bedrock AccessDeniedException' }
  })())
  ok('jobId 를 못 받으면 폴링하지 않고 바로 실패한다', await (async () => {
    let polls = 0
    const post = async (q) => { if (q.startsWith('mutation')) return { plan: null }; polls++; return {} }
    try { await runPlanJob(post, { prompt: '충분히 긴 프롬프트다' }, FAST); return false }
    catch { return polls === 0 }
  })())
  ok('폴링이 몇 번 끊겨도 잡을 버리지 않는다 — Bedrock 은 계속 돌고 있다', await (async () => {
    let polls = 0
    const post = async (q) => {
      if (q.startsWith('mutation')) return { plan: { jobId: 'j' } }
      if (++polls <= 4) throw new Error('네트워크 끊김')
      return { planResult: asWire({ status: 'done', text: '살아남았다', usage: {}, stop: 'end_turn' }) }
    }
    return (await runPlanJob(post, { prompt: '충분히 긴 프롬프트다' }, FAST)).text === '살아남았다'
  })())
  ok('연속 폴링 실패가 이어지면 포기한다', await (async () => {
    const post = async (q) => {
      if (q.startsWith('mutation')) return { plan: { jobId: 'j' } }
      throw new Error('계속 끊김')
    }
    try { await runPlanJob(post, { prompt: '충분히 긴 프롬프트다' }, FAST); return false }
    catch (e) { return e.message === '계속 끊김' }
  })())
  ok('끝나지 않으면 타임아웃으로 끊는다 — 무한정 기다리지 않는다', await (async () => {
    const { post } = fakePlanServer(1e9, null)
    const t0 = Date.now()
    try { await runPlanJob(post, { prompt: '충분히 긴 프롬프트다' }, { pollMs: 1, timeoutMs: 120 }); return false }
    catch (e) { return e.message.includes('안에 끝나지 않았다') && Date.now() - t0 < 3000 }
  })())
  ok('기본 대기 상한은 Lambda 타임아웃과 같은 120초', PLAN_TIMEOUT_MS === 120_000)

  // ── parseJson: 모델 응답에서 JSON 꺼내기 ───────────────────────────────────
  // "JSON 하나만" 을 못 박아도 코드펜스·앞말이 붙어 오고, 응답 상한에 걸리면 문장 중간에서
  // 끊긴다. "기획 결과가 깨져서 왔습니다" 로 실패하던 자리다.
  ok('코드펜스를 벗긴다 — ```json 과 ``` 둘 다', (() => {
    const want = (v) => v && v.a === 1
    return want(parseJson('```json\n{"a":1}\n```')) && want(parseJson('```\n{"a":1}\n```'))
      && want(parseJson('```JSON\n{"a":1}\n```'))
  })())
  ok('닫는 펜스가 없어도(잘린 응답) 벗긴다', parseJson('```json\n{"a":1}').a === 1)
  ok('앞뒤 설명을 버리고 JSON 만 꺼낸다',
    parseJson('알겠습니다. 아래와 같이 만들었습니다:\n{"a":1}\n더 필요하시면 말씀해 주세요.').a === 1)
  ok('최상위가 배열이어도 읽는다', parseJson('설명\n[{"a":1},{"a":2}]').length === 2)
  ok('앞말에 낀 괄호에 속지 않는다', (() => {

  // ── ask 재시도: 못 읽은 응답은 원문을 남기고 다시 물어본다 ──────────────────
  const GOOD_STORY = '{"title":"성공","logline":"l","pivot":{"title":"t","body":"b"},"branches":[]}'
  /** console.log·warn 을 잠시 받아 적는다. 실패 원문이 정말 남는지 보려면 이것뿐이다 */
  const withConsole = async (fn) => {
    const said = []
    const { log, warn } = console
    console.log = (...a) => said.push(a.join(' '))
    console.warn = (...a) => said.push(a.join(' '))
    try {
      return { said, out: await fn() }
    } finally {
      console.log = log
      console.warn = warn
    }
  }

  ok('못 읽은 응답은 두 번까지 다시 물어본다', await (async () => {

    const { out } = await withConsole(() => planBranches(net, seed0, seedStore))
    return calls === 3 && out.title === '성공'
  })())
  ok('세 번 다 못 읽으면 에러를 낸다', await (async () => {

  })())

  ok('실패한 응답 원문을 콘솔에 남긴다', await (async () => {

    return rawLines.length === 3 && rawLines[0].includes('엉뚱한 답이다')

  ok('상한에서 잘렸으면 다시 물을 때 더 짧게 쓰라고 붙인다', await (async () => {

  ok('대본 파일 이름에 제목이 들어간다', scriptFileName('마지막 레시피') === '마지막 레시피_대본.txt')
  ok('제목이 없으면 무제로 둔다', scriptFileName('') === '무제_대본.txt' && scriptFileName(null) === '무제_대본.txt')
  ok('파일 이름에서 경로 문자를 뺀다', scriptFileName('A/B:C*D') === 'A B C D_대본.txt')

  // ── graph-view.js: 엣지 라벨과 역기입 전후 비교 ────────────────────────────
  // 캔버스 그리기는 여기서 못 돌린다 — 순수 함수인 라벨 표와 판 비교만 본다
  ok('엣지 라벨은 "A ─라벨→ B" 로 읽힌다', edgeLabel('conceals') === '을 은닉함'
    && edgeLabel('serves') === '을 보좌함' && edgeLabel('member_of') === '에 소속됨')
  ok('표에 없는 술어는 원본 영문 그대로 둔다',
    edgeLabel('reveals') === 'reveals' && edgeLabel('calls_true_name') === 'calls_true_name')
  ok('술어가 없으면 빈 문자열이다', edgeLabel(null) === '' && edgeLabel(undefined) === '')
  ok('kin_of 는 props.type 으로 부모·자녀·형제를 가른다',
    edgeLabel('kin_of', { type: 'parent' }) === '의 부모임'
    && edgeLabel('kin_of', { type: 'child' }) === '의 자녀임'
    && edgeLabel('kin_of', { type: 'sibling' }) === '의 형제임')
  ok('kin_of 의 type 이 없으면 술어를 그대로 둔다',
    edgeLabel('kin_of') === 'kin_of' && edgeLabel('kin_of', { type: '?' }) === 'kin_of')
  ok('파생 전용 술어에도 라벨이 있다', edgeLabel('has_leverage_over') === '의 약점을 쥠')
  ok('라벨 표는 어휘의 실제 술어를 덮는다', (() => {
    // 표에 있으면서 어휘에 없는 키는 kin_of 로 갈라 읽는 셋과 owns/wants 뿐이다
    const extra = Object.keys(EDGE_LABELS_KR).filter((p) => !GRAPH_SCHEMA.edgeRels.includes(p))
    return extra.every((p) => ['child_of', 'parent_of', 'sibling_of', 'owns', 'wants'].includes(p))
  })())

  ok('graphDelta 는 새 노드·엣지와 끊긴 엣지를 가른다', (() => {
    const before = {
      nodes: [{ id: 'a' }, { id: 'b' }],
      edges: [{ s: 'a', p: 'loves', o: 'b' }, { s: 'b', p: 'distrusts', o: 'a' }],
    }
    const after = {
      nodes: [{ id: 'a' }, { id: 'b' }, { id: 'c' }],
      edges: [{ s: 'a', p: 'loves', o: 'b' }, { s: 'a', p: 'knows', o: 'c' }],
    }
    const d = graphDelta(before, after)
    return d.nodes.join() === 'c' && d.edges.join() === 'a|knows|c'
      && d.removed.length === 1 && d.removed[0].p === 'distrusts'
  })())
  ok('바뀐 것이 없으면 delta 가 비어 있다', (() => {
    const g = { nodes: [{ id: 'a' }], edges: [{ s: 'a', p: 'loves', o: 'a' }] }
    const d = graphDelta(g, g)
    return !d.nodes.length && !d.edges.length && !d.removed.length
  })())
  ok('graphDelta 는 판이 없어도 죽지 않는다', (() => {
    const d = graphDelta(null, undefined)
    const e = graphDelta({}, { nodes: [{ id: 'a' }] })
    return !d.nodes.length && !d.removed.length && e.nodes.join() === 'a'
  })())
  ok('같은 쌍의 다른 술어는 다른 엣지로 센다', (() => {
    const before = { nodes: [{ id: 'a' }, { id: 'b' }], edges: [{ s: 'a', p: 'loves', o: 'b' }] }
    const after = {
      nodes: before.nodes,
      edges: [{ s: 'a', p: 'loves', o: 'b' }, { s: 'a', p: 'distrusts', o: 'b' }],
    }
    return graphDelta(before, after).edges.join() === 'a|distrusts|b'
  })())
  ok('실제 저장소의 역기입 전후를 견줘도 맞는다', (() => {
    const store = createGraphStore({
      nodes: [{ id: 'a', kind: 'Character', name: '가' }, { id: 'b', kind: 'Character', name: '나' }],
      edges: [{ s: 'a', p: 'loves', o: 'b', asserted: true }],
    })
    const before = store.toJSON()
    const applied = applyWriteback(store, {
      nodes: [{ id: 's1', kind: 'Secret', name: '숨긴 일', props: { claim: '한 줄' } }],
      edges: [{ s: 'a', p: 'conceals', o: 's1' }],
      remove_edges: [{ s: 'a', p: 'loves', o: 'b' }],
    })
    const d = graphDelta(before, store.toJSON())
    // applied 는 개수만 준다 — 그 개수와 delta 의 id 개수가 어긋나지 않아야 한다
    return applied.applied.nodesAdded === d.nodes.length && d.nodes.join() === 's1'
      && d.edges.includes('a|conceals|s1') && d.removed.some((e) => e.p === 'loves')
  })())

  // ── mock/graph.json 과의 호환: 추출 결과를 그대로 뷰어에 넣을 수 있는가 ──────
  const grab = async (p) => {
    const r = await fetch(`${p}?t=${Date.now()}`)
    if (!r.ok) throw new Error(`${p} ${r.status}`)
    return r.json()
  }
  try {
    const [canon, rawExtract, built, seeds, stories] = await Promise.all([
      grab('mock/graph.json'), grab('fixtures/kdh-extract-raw.json'), grab('fixtures/extracted-graph.json'),
      grab('mock/seeds.json'), grab('mock/stories.json'),
    ])

    ok('canon 의 kind 가 모두 어휘 안에 있다', canon.nodes.every((n) => GRAPH_SCHEMA.nodeKinds.includes(n.kind)))
    ok('canon 의 술어가 모두 어휘 안에 있다', canon.edges.every((e) => GRAPH_SCHEMA.edgeRels.includes(e.p)))
    ok('canon 을 정규화해도 그대로다', (() => {
      const g = normalizeGraph(canon)
      return g.nodes.length === canon.nodes.length && g.edges.length === canon.edges.length && g.warnings.length === 0
    })())

    const g = normalizeGraph(rawExtract)
    const derived = deriveEdges(g.nodes, g.edges)
    const extracted = { nodes: g.nodes, edges: [...g.edges, ...derived] }

    ok('추출 원본의 흠은 경고로 남는다', g.warnings.length >= 5)
    ok('추출 결과 노드 수가 canon 과 같다', extracted.nodes.length === canon.nodes.length,
      `${extracted.nodes.length} / ${canon.nodes.length}`)
    ok('canon 노드가 하나도 빠지지 않았다', (() => {
      const got = new Set(extracted.nodes.map((n) => n.id))
      return canon.nodes.every((n) => got.has(n.id))
    })())
    ok('canon 엣지가 하나도 빠지지 않았다', (() => {
      const got = new Set(extracted.edges.map(edgeKey))
      const miss = canon.edges.filter((e) => !got.has(edgeKey(e)))
      return miss.length === 0
    })())
    ok('canon 에 없는 엣지를 만들지 않았다', (() => {
      const want = new Set(canon.edges.map(edgeKey))
      return extracted.edges.every((e) => want.has(edgeKey(e)))
    })())
    ok('명시 18 / 파생 4 로 canon 과 같다',
      extracted.edges.filter((e) => e.asserted).length === canon.edges.filter((e) => e.asserted).length
      && extracted.edges.filter((e) => !e.asserted).length === canon.edges.filter((e) => !e.asserted).length,
      `${extracted.edges.filter((e) => e.asserted).length} / ${extracted.edges.filter((e) => !e.asserted).length}`)
    ok('추출 결과는 canon 과 모순이 없다', validateAgainstCanon(extracted, canon).compatible)
    ok('파생 엣지는 모두 규칙 이름을 달고 있다',
      derived.length === 4 && derived.every((e) => !!e.props.derived_by),
      derived.map((e) => e.props.derived_by).join(' '))
    ok('빌드해 둔 fixtures/extracted-graph.json 이 지금 결과와 같다',
      JSON.stringify({ nodes: built.nodes, edges: built.edges }) === JSON.stringify(extracted))

    // story-graph.html 의 loadMock() 이 하는 검사 그대로
    ok('loadMock 검사를 통과한다 (nodes/edges 배열)',
      Array.isArray(built.nodes) && Array.isArray(built.edges))
    ok('loadMock 검사를 통과한다 (씨앗 수 = 스토리 수)',
      Array.isArray(seeds) && Array.isArray(stories) && seeds.length === stories.length)
    ok('뷰어 카운트가 14 / 22 / 4 / 4 다', (() => {
      const a = built.edges.filter((e) => e.asserted).length
      const d = built.edges.filter((e) => !e.asserted).length
      return built.nodes.length === 14 && built.edges.length === 22 && d === 4 && seeds.length === 4 && a === 18
    })())
    ok('씨앗이 가리키는 노드가 추출 결과에 다 있다', (() => {
      const ids = new Set(built.nodes.map((n) => n.id))
      return seeds.every((s) => s.focus.every((f) => ids.has(f)))
    })())

    // ── canon 을 저장소에 올려 씨앗과 분기까지 굴려 본다 ──────────────────────
    const store = createGraphStore(canon)
    ok('canon 저장소 통계가 14 / 18 / 4 다', (() => {
      const st = store.stats()
      return st.nodes === 14 && st.assertedEdges === 18 && st.derivedEdges === 4
    })(), JSON.stringify(store.stats()))
    ok('추론 엣지를 canon 과 같은 것으로 다시 만든다', (() => {
      const want = new Set(canon.edges.filter((e) => !e.asserted).map(edgeKey))
      const got = new Set(store.toJSON().edges.filter((e) => !e.asserted).map(edgeKey))
      return want.size === got.size && [...want].every((k) => got.has(k))
    })())
    ok('rumi 는 Character 다', store.getNode('rumi').kind === 'Character')
    ok('rumi 에서 나가는 엣지가 3개 이상이다', store.getEdgesFrom('rumi').length >= 3,
      String(store.getEdgesFrom('rumi').length))
    ok('loves 엣지가 잡힌다', store.getEdgesByPredicate('loves').length >= 1)
    ok('rumi 의 1-hop 이웃에 jinu 가 있다',
      store.getNeighbors('rumi', { depth: 1 }).some((n) => n.id === 'jinu'))
    ok('세 노드 서브그래프에 그 사이 엣지가 담긴다', (() => {
      const sub = store.getSubgraph(['rumi', 'celine', 'gwima'])
      return sub.nodes.length === 3
        && sub.edges.some((e) => e.s === 'celine' && e.p === 'mentor_of' && e.o === 'rumi')
        && sub.edges.every((e) => ['rumi', 'celine', 'gwima'].includes(e.s))
    })())
    ok('canon 을 그대로 내보내면 엣지 22개다', store.toJSON().edges.length === 22)

    const liveSeeds = findSeeds(store)
    ok('탐지기가 씨앗을 4개 이상 찾는다', liveSeeds.length >= 4, String(liveSeeds.length))
    ok('씨앗 모양이 mock/seeds.json 과 같다', (() => {
      const want = Object.keys(seeds[0]).sort().join(',')
      return liveSeeds.every((s) => Object.keys(s).sort().join(',') === want)
    })(), Object.keys(liveSeeds[0]).sort().join(','))
    ok('모든 씨앗의 probe 가 등록된 탐지기다', liveSeeds.every((s) => !!PROBES[s.probe]))
    ok('모든 씨앗의 초점이 실제 노드다', (() => {
      const ids = new Set(canon.nodes.map((n) => n.id))
      return liveSeeds.every((s) => s.focus.length > 0 && s.focus.every((f) => ids.has(f)))
    })())
    ok('비밀 레버리지 씨앗이 루미의 문양을 가리킨다',
      liveSeeds.some((s) => s.probe === 'secret_leverage' && s.focus.includes('s_rumi_patterns')
        && s.focus.includes('celine') && s.focus.includes('gwima')))
    ok('삼각 씨앗이 루미·진우를 함께 잡는다',
      liveSeeds.some((s) => s.probe === 'love_triangle' && s.focus.includes('rumi') && s.focus.includes('jinu')))
    ok('값 안 치른 사건으로 혼문 균열과 진우의 거래를 잡는다', (() => {
      const got = liveSeeds.filter((s) => s.probe === 'dangling_consequence')
      return got.some((s) => s.focus.includes('honmoon_crack')) && got.some((s) => s.focus.includes('jinu_deal'))
    })())
    ok('가장 높은 씨앗은 mock/seeds.json 과 같은 점수대다',
      liveSeeds[0].score >= 1.2 && liveSeeds[0].score <= 2, String(liveSeeds[0].score))
    ok('목 씨앗도 같은 모양이다',
      seeds.every((s) => typeof s.probe === 'string' && typeof s.score === 'number' && Array.isArray(s.focus)))

    ok('mock/stories.json 이 normalizeStory 를 그대로 통과한다', (() => {
      const got = stories.map((st) => normalizeStory(st))
      return got.every((st) => st.warnings.length === 0 && st.branches.length === 3
        && st.branches.every((b) => b.beats.length >= 3 && Object.keys(b.outcome).length > 0
          && b.writeback.nodes.length >= 1 && b.writeback.edges.length >= 1))
    })())
    ok('로컬 폴백이 목 스토리 묶음에서 맞는 것을 골라 온다', (() => {
      const pool = seeds.map((s, i) => ({ ...stories[i], probe: s.probe, focus: s.focus }))
      const want = stories[seeds.findIndex((s) => s.probe === 'secret_leverage')].title
      const hit = localBranches(liveSeeds.find((s) => s.probe === 'secret_leverage'), store, pool)
      return hit.title === want && hit.branches.length === 3
    })())
    ok('맞는 것이 없으면 임시 분기를 만든다', (() => {
      const odd = liveSeeds.find((s) => s.probe === 'power_vacuum') || liveSeeds.at(-1)
      const st = localBranches(odd, store, [])
      return st.branches.length === 3 && st.local === true
    })())
    ok('컨텍스트 팩이 canon 의 씨앗 주변만 담는다', (() => {
      const ctx = contextPackPrompt(liveSeeds[0], store)
      return ctx.includes('[씨앗]') && ctx.includes('[구조적 결함]') && ctx.length < 4000
    })())

    // ── canon + mock/stories.json 의 역기입을 실제로 얹어 본다 ────────────────
    const mockStories = stories.map((st) => normalizeStory(st))
    const fresh = () => createGraphStore(canon)
    const seedSig = (list) => list.map((s) => `${s.probe}:${s.focus.join('+')}`).sort().join(',')
    const canonSeeds = seedSig(findSeeds(fresh()))

    ok('mock 스토리의 첫 분기 역기입은 canon 위에서 safe 하다', (() => {
      const v = validateWritebackBeforeApply(fresh(), mockStories[0].branches[0].writeback)
      return v.safe === true && v.preview.nodesAdded === 1 && v.preview.edgesAdded === 4
    })(), JSON.stringify(validateWritebackBeforeApply(fresh(), mockStories[0].branches[0].writeback).preview))
    ok('mock 분기 12개를 다 얹어도 크래시하지 않는다', (() => {
      let moved = 0
      for (const st of mockStories) {
        for (const b of st.branches) {
          const store2 = fresh()
          const r = applyWriteback(store2, b.writeback)
          if (r.applied.nodesAdded + r.applied.edgesAdded > 0) moved++
          if (!Array.isArray(r.newSeeds)) return false
        }
      }
      return moved === 12
    })())
    ok('역기입이 그래프를 키우면 탐침이 새 씨앗을 찾는다', (() => {
      // 3번 스토리 A 분기는 새 Secret 과 knows 를 넣어 비밀 레버리지 자리를 만든다
      const store2 = fresh()
      const r = applyWriteback(store2, mockStories[3].branches[0].writeback)
      const after = seedSig(r.newSeeds)
      return after !== canonSeeds && r.newSeeds.length > findSeeds(fresh()).length
    })(), `${findSeeds(fresh()).length} -> ${applyWriteback(fresh(), mockStories[3].branches[0].writeback).newSeeds.length}`)
    ok('진우 serves 귀마 를 끊으면 귀마 rival_of 루미 파생도 사라진다', (() => {
      const store2 = fresh()
      const had = store2.getEdgesFrom('gwima').some((e) => e.p === 'rival_of' && e.o === 'rumi')
      const r = applyWriteback(store2, { remove_edges: [{ s: '진우', p: 'serves', o: '귀마' }] })
      const now = store2.getEdgesFrom('gwima').some((e) => e.p === 'rival_of' && e.o === 'rumi')
      return had && !now && r.applied.edgesRemoved === 1 && r.applied.derivedLost === 1
    })())
    ok('엣지를 끊으면 그 자리에서 나왔던 씨앗도 줄어든다', (() => {
      const store2 = fresh()
      const r = applyWriteback(store2, { remove_edges: [{ s: '진우', p: 'serves', o: '귀마' }] })
      return r.newSeeds.length < findSeeds(fresh()).length
    })())
    ok('역기입은 노드 이름으로 온 엣지도 id 로 옮겨 붙인다', (() => {
      const store2 = fresh()
      applyWriteback(store2, mockStories[0].branches[0].writeback)
      return store2.getEdgesFrom('rumi').some((e) => e.p === 'calls_true_name' && e.o === 'jinu')
    })())
    ok('역기입으로 들어온 새 사건은 t 를 지킨다', (() => {
      const store2 = fresh()
      applyWriteback(store2, mockStories[0].branches[0].writeback)
      const made = store2.getNodes({ kind: 'Event' }).find((n) => n.name === '이름의 호명')
      return !!made && made.props.t === 0 && !!made.props.desc
    })())
    ok('mock 분기를 spec 으로 옮기면 컷 확장까지 이어진다', await (async () => {
      const b = mockStories[0].branches[0]
      const spec = branchToSpec(b, { secs: 60, cuts: 8 })
      const outline = await planBranchOutline(null, b, spec, { chars: [], title: mockStories[0].title })
      return outline.beats.length === b.beats.length && outline.local === true
        && localScript(outline.beats, {}).includes('S#1.')
    })())

  } catch (err) {
    ok(`mock/fixtures 를 읽지 못했다 — HTTP 로 열어야 한다 (${err.message})`, false)
  }

  out.insertAdjacentHTML('beforeend',
    `\n<span class="${failed ? 'fail' : 'pass'}">${failed ? failed + '개 실패' : '전부 통과'}</span>\n`)
</script>
