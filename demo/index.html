<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여름 스튜디오 — 스토리보드 플랫폼</title>

<!--
  홈. 로그인하면 바로 어느 화면에 떨어지는 게 아니라, 다섯 단계를 순서대로 보여주고
  고르게 합니다.

  전에는 이 자리(/)가 스토리보드였습니다. 그런데 스토리보드는 이야기가 다 만들어진
  뒤에 쓰는 화면입니다. 로그인하자마자 마지막 단계에 떨어지니 앞의 네 단계가 있는 줄
  모르고, 상단 탭 바만으로는 무엇부터 해야 하는지 읽히지 않았습니다. 그래서 보드를
  /board.html 로 옮기고 이 자리에 순서를 보여주는 화면을 두었습니다.

  로그인 문이 여기 있습니다. 세션은 sessionStorage 나 localStorage 에 담기고
  (demo/auth.js 의 KEY = 'sb.auth') 같은 오리진의 다른 화면이 그것을 그대로 읽으므로,
  여기서 한 번 로그인하면 보드·디벨롭·키비주얼이 다시 묻지 않습니다. 각 화면은 자기
  로그인 문을 그대로 갖고 있어서 주소로 바로 들어가도 막히지 않습니다.
-->
<link rel="stylesheet" href="./theme.css">
<script src="/aws-config.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box }
  html, body { height: 100% }
  body {
    margin: 0; font-family: var(--sb-sans); color: var(--sb-ink);
    background: var(--sb-bg); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  /* ── 머리 ───────────────────────────────────────── */
  .top {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 13px 22px; border-bottom: 1px solid var(--sb-line);
  }
  .top__mark {
    width: 22px; height: 22px; border-radius: 5px; flex: none;
    background: var(--sb-accent); color: #fff;
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
  }
  .top__name { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em }
  .top__env {
    font-family: var(--sb-mono); font-size: 10px; letter-spacing: .1em;
    color: var(--sb-ink-3); padding: 2px 7px; border: 1px solid var(--sb-line);
    border-radius: 999px;
  }
  .top__me { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 12.5px }
  .top__me[hidden] { display: none }
  .top__who { color: var(--sb-ink-2) }
  .top__out {
    background: none; border: 1px solid var(--sb-line); border-radius: var(--sb-r);
    padding: 4px 10px; font: inherit; font-size: 12px; color: var(--sb-ink-2); cursor: pointer;
  }
  .top__out:hover { border-color: var(--sb-ink-3); color: var(--sb-ink) }

  /* ── 본문 ───────────────────────────────────────── */
  .wrap {
    flex: 1 1 auto; min-height: 0; overflow: auto;
    padding: 40px 22px 56px; display: flex; justify-content: center;
  }
  .col { width: min(880px, 100%) }

  .lede__eyebrow {
    font-family: var(--sb-mono); font-size: 10.5px; letter-spacing: .16em;
    color: var(--sb-accent); text-transform: uppercase;
  }
  .lede__h { margin: 9px 0 6px; font-size: 27px; font-weight: 700; letter-spacing: -.025em }
  .lede__p { margin: 0 0 26px; font-size: 14px; line-height: 1.65; color: var(--sb-ink-2) }

  /*
   * 단계 목록. 세로로 쌓고 왼쪽에 번호를 둡니다 — 가로로 늘어놓으면 다섯 개가 그냥
   * 나란한 버튼으로 보이고, 앞뒤 순서가 있다는 것이 읽히지 않습니다. 사용자가 원한
   * 것은 순서가 명확히 보이는 것이었습니다.
   */
  .steps { display: grid; gap: 9px; list-style: none; margin: 0; padding: 0; counter-reset: s }
  .step { position: relative }
  .step__go {
    display: flex; align-items: center; gap: 15px; width: 100%; text-align: left;
    padding: 15px 17px; font: inherit; color: inherit; text-decoration: none;
    background: var(--sb-panel); border: 1px solid var(--sb-line);
    border-radius: var(--sb-r-lg); cursor: pointer;
    transition: border-color .14s, box-shadow .14s, transform .14s;
  }
  .step__go:hover {
    border-color: var(--sb-accent-line); box-shadow: var(--sb-sh);
    transform: translateY(-1px);
  }
  .step__go:focus-visible { outline: 2px solid var(--sb-accent); outline-offset: 2px }
  .step__n {
    flex: none; width: 27px; height: 27px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--sb-fill); border: 1px solid var(--sb-line);
    font-family: var(--sb-mono); font-size: 11.5px; color: var(--sb-ink-3);
  }
  .step__go:hover .step__n {
    background: var(--sb-accent-soft); border-color: var(--sb-accent-line); color: var(--sb-accent);
  }
  .step__body { min-width: 0 }
  .step__label { font-size: 14.5px; font-weight: 600; letter-spacing: -.01em }
  .step__desc { margin-top: 2px; font-size: 12.5px; color: var(--sb-ink-3) }
  .step__arrow { margin-left: auto; flex: none; color: var(--sb-line-2); font-size: 15px }
  .step__go:hover .step__arrow { color: var(--sb-accent) }

  /* 아직 화면이 없는 단계. 누를 수 없다는 게 눌러 보기 전에 보여야 합니다 */
  .step--soon .step__go { cursor: default; background: var(--sb-fill); border-style: dashed }
  .step--soon .step__go:hover {
    transform: none; box-shadow: none; border-color: var(--sb-line);
  }
  .step--soon .step__label, .step--soon .step__desc { color: var(--sb-ink-3) }
  .step__soon {
    margin-left: auto; flex: none; font-size: 10.5px; letter-spacing: .06em;
    color: var(--sb-ink-3); background: var(--sb-bg);
    border: 1px solid var(--sb-line); border-radius: 999px; padding: 3px 9px;
  }

  .foot { margin-top: 26px; font-size: 12px; line-height: 1.7; color: var(--sb-ink-3) }
  .foot a { color: var(--sb-accent-ink) }

  /* ── 로그인 문 ───────────────────────────────────── */
  .gate {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(15, 20, 30, .55); backdrop-filter: blur(3px);
    display: grid; place-items: center; padding: 24px;
  }
  .gate[hidden] { display: none }
  .gate__card {
    background: var(--sb-panel); border-radius: var(--sb-r-lg); padding: 24px;
    width: min(430px, 100%); box-shadow: var(--sb-sh-lg);
    max-height: 100%; overflow: auto;
  }
  .gate__eyebrow {
    font-family: var(--sb-mono); font-size: 10px; letter-spacing: .18em; color: var(--sb-accent);
  }
  .gate__title { margin: 8px 0 4px; font-size: 19px; font-weight: 700; letter-spacing: -.01em }
  .gate__sub { margin: 0 0 18px; font-size: 12.5px; line-height: 1.6; color: var(--sb-ink-2) }
  .gate__list { display: grid; gap: 7px }
  .gate__who {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: var(--sb-panel); border: 1px solid var(--sb-line); border-radius: var(--sb-r);
    padding: 11px 13px; cursor: pointer; font: inherit; color: var(--sb-ink);
  }
  .gate__who:hover, .gate__who:focus-visible {
    background: var(--sb-fill); border-color: var(--sb-accent-line);
  }
  .gate__who:disabled { opacity: .5; cursor: default }
  .gate__dot { width: 24px; height: 24px; border-radius: 50%; flex: none }
  .gate__name { font-weight: 600; font-size: 13.5px }
  .gate__role {
    font-family: var(--sb-mono); font-size: 10px; letter-spacing: .1em; color: var(--sb-ink-3);
  }
  .gate__job { margin-left: auto; font-size: 11.5px; color: var(--sb-ink-3) }

  .lf { display: block; margin-bottom: 12px }
  .lf__label {
    display: block; font-family: var(--sb-mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--sb-ink-3); margin-bottom: 5px;
  }
  .lf input[type=text], .lf input[type=password] {
    width: 100%; padding: 9px 11px; font: inherit; font-size: 13.5px;
    background: var(--sb-bg); color: var(--sb-ink);
    border: 1px solid var(--sb-line); border-radius: var(--sb-r);
  }
  .lf input:focus {
    outline: none; border-color: var(--sb-accent);
    box-shadow: 0 0 0 3px var(--sb-accent-soft);
  }
  .lf--check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--sb-ink-2) }
  .lf--check input { margin: 0 }
  .lf__or {
    margin: 16px 0 12px; font-size: 11px; color: var(--sb-ink-3); text-align: center;
    border-top: 1px solid var(--sb-line); padding-top: 12px;
  }
  .lf__why { margin: 9px 0 0; font-size: 12px; color: var(--sb-no); min-height: 1em }
  .lf__note { margin: 12px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--sb-ink-3) }
  .btn {
    font: inherit; cursor: pointer; border-radius: var(--sb-r);
    border: 1px solid var(--sb-line); background: var(--sb-panel); color: var(--sb-ink);
    padding: 9px 14px; font-size: 13px;
  }
  .btn--solid {
    background: var(--sb-accent); border-color: var(--sb-accent); color: #fff; font-weight: 600;
  }
  .btn--solid:hover { background: var(--sb-accent-ink); border-color: var(--sb-accent-ink) }
  .btn--wide { width: 100%; margin-top: 4px }
  .btn:disabled { opacity: .55; cursor: default }

  @media (max-width: 560px) {
    .wrap { padding: 26px 15px 40px }
    .lede__h { font-size: 22px }
    .step__desc { display: none }
  }
</style>
</head>
<body>

<header class="top">
  <span class="top__mark" aria-hidden="true">S</span>
  <span class="top__name">여름 스튜디오</span>
  <span class="top__env" id="env">로컬</span>
  <div class="top__me" id="meBox" hidden>
    <span class="top__who" id="meWho"></span>
    <button class="top__out" id="meOut" type="button">로그아웃</button>
  </div>
</header>

<main class="wrap">
  <div class="col">
    <div class="lede__eyebrow">스토리보드 플랫폼</div>
    <h1 class="lede__h">어디부터 시작할까요?</h1>
    <p class="lede__p">
      시놉시스에서 시작해 대본이 되고, 그림이 나오고, 마지막에 보드에 얹힙니다.
      순서대로 가도 되고 필요한 단계만 골라도 됩니다.
    </p>
    <ol class="steps" id="steps"></ol>
    <p class="foot" id="foot"></p>
  </div>
</main>

<div class="gate" id="gate" hidden></div>

<script type="module" src="./home.js"></script>
</body>
</html>
