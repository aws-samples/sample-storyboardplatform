
schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Op {
  boardId: ID!
  id: ID!
  ts: String!
  actor: ID!
  body: String!
}

type OpPage {
  items: [Op!]!
  nextToken: String
}

type Presence {
  boardId: ID!
  actor: ID!
  body: String!
}

# plan 을 띄웠다는 접수증. 결과는 여기 없다. planResult 로 받아 간다.
type PlanJob {
  jobId: ID!
  status: String!
}

# 세계관 네비게이터 챗봇의 질문 한 건. plan 과 같은 비동기 패턴을 쓴다.
input NavigateInput {
  projectId: String!
  question: String!
  # 지금 화면에 있는 그래프 {nodes, edges}. 없으면 Lambda 가 빈 그래프로 답한다
  graphData: AWSJSON
  # 이전 대화 [{role, content}, ...]. 최근 몇 턴만 모델에 다시 들어간다
  conversationHistory: AWSJSON
  model: String
}

# 작업판 앞에 세우는 프로젝트 카드 한 장.
#
# op 로그와 다른 항목에 따로 담는다. op 는 pk=BOARD#<id> 로 흩어져 있어서 목록을 뽑으려면
# 테이블을 Scan 해야 하고, 30일 TTL 이 걸려 있다. 프로젝트 이름이 한 달 뒤에 사라지면
# 카드가 이름 없는 보드가 된다. 그래서 pk='PROJECTS' 한 자리에 모으고 TTL 을 걸지 않는다.
#
# lastWhat/lastActor 는 op 로그에서 온 것을 적어 둔 사본이다. 사실은 로그가 갖고 있고
# 이건 카드에 보여줄 한 줄이다. 카드 20장을 그리려고 보드 20개의 로그를 다 읽을 수는 없다.
type Project {
  boardId: ID!
  name: String!
  createdAt: String!
  createdBy: ID!
  updatedAt: String!
  lastActor: ID
  lastWhat: String
}

type ProjectPage {
  items: [Project!]!
  nextToken: String
}

# 프로젝트가 들고 있는 에셋 한 개. 대본·시놉시스·그래프·씬·키비주얼·콘티가 그것이다.
#
# op 로그와 같은 pk=BOARD#<boardId> 에 살고 sk 만 'ASSET#<kind>' 다. 그래서 프로젝트
# 하나의 에셋 전부가 Query 한 번에 온다. 'ASSET#' 은 사전순으로 'OP#' 보다 앞이라
# listOps 의 두 갈래(begins_with 'OP#', sk > 'OP#<since>#') 모두 이것을 집지 않는다.
#
# op 와 달리 kind 마다 한 항목을 덮어쓰고 TTL 이 없다. op 는 「무슨 일이 있었나」의
# 기록이라 쌓이고 30일 뒤 사라져도 되지만, 에셋은 「지금의 대본」이라서 하나면 되고
# 사라지면 안 된다. 한 달 쉰 프로젝트를 열었을 때 대본이 없으면 그 프로젝트는 없는
# 것과 같다.
#
# body 는 AWSJSON 이다. 대본처럼 통째로 긴 글도 JSON 문자열 하나로 담는다. 종류마다
# 모양이 다르고 그 모양을 아는 곳은 브라우저(app/domain/assets.js)라서, 스키마에
# 종류별 타입을 세우지 않는다. 세우면 씬에 필드 하나를 더할 때마다 스키마를 배포해야
# 한다.
type Asset {
  boardId: ID!
  kind: String!
  body: AWSJSON!
  actor: ID!
  updatedAt: String!
}

type AssetPage {
  items: [Asset!]!
  nextToken: String
}

type Query {
  listOps(boardId: ID!, since: String, nextToken: String): OpPage!

  # 작업판 앞에 세울 프로젝트 카드 전부. 최근에 손댄 것이 먼저 온다.
  listProjects(nextToken: String): ProjectPage!

  # 프로젝트 하나가 들고 있는 에셋 전부. 종류 수만큼(지금 여섯)만 온다.
  listAssets(boardId: ID!, nextToken: String): AssetPage!

  # plan 결과 한 건. 아직 끝나지 않았으면 {status:"pending"} 이 온다.
  # 끝났으면 {status:"done", text, usage, stop}, 실패했으면 {status:"error", error}.
  # 잡을 띄운 사람만 읽을 수 있다.
  planResult(jobId: ID!): AWSJSON!

  # navigate 결과 한 건. planResult 와 같은 항목을 읽는다 — 모양도 같다.
  # owner 는 받기만 하고 쓰지 않는다. 대조는 토큰의 클레임으로 한다.
  navigateResult(jobId: ID!, owner: String): AWSJSON!

  # 관계 그래프. Neptune 을 도는 Lambda 가 받는다.
  # loadGraph 는 {nodes, edges}, queryGraph 는 spec.type 에 따라 모양이 달라진다.
  loadGraph(projectId: String): AWSJSON!
  queryGraph(spec: AWSJSON!): AWSJSON!

  # 붙어 있는 커넥터와 고를 수 있는 모델. 키는 절대 나오지 않는다.
  # {providers:[{id, label, hint, fields, configured, at, models:[...]}]}
  connectors: AWSJSON!

  # 커넥터 잡 결과 한 건. planResult 와 같은 방식이다.
  # {status:"pending"} / {status:"done", url, kind, model, ms} / {status:"error", error}
  genResult(jobId: ID!): AWSJSON!
}

type Mutation {
  publishOp(boardId: ID!, id: ID!, ts: String!, actor: ID!, body: String!): Op!

  # 프로젝트 카드를 앉히거나, 마지막 손길만 고쳐 준다.
  # 이름은 만들 때 한 번만 받고 그 뒤로는 덮어쓰지 않는다. 여러 사람이 같은 보드를
  # 동시에 열어도 이름이 서로 뒤집히지 않게 한다.
  putProject(boardId: ID!, name: String, actor: ID!, what: String, ts: String!): Project!

  # 에셋 한 개를 앉힌다. 같은 kind 를 다시 쓰면 덮어쓴다.
  # 리뷰어는 쓸 수 없다. 에셋은 작품 그 자체이고 리뷰어의 권한은 의견까지다.
  putAsset(boardId: ID!, kind: String!, body: AWSJSON!, actor: ID!, ts: String!): Asset!
  publishPresence(boardId: ID!, actor: ID!, body: String!): Presence!

  # plan 은 Query 가 아니라 Mutation 이다. AppSync 요청 실행 시간 상한이 30초(변경 불가)라서
  # 느린 모델을 동기로 기다릴 수 없다. Lambda 를 Event 로 띄우고 jobId 만 즉시 돌려준다.
  plan(spec: AWSJSON!): PlanJob!

  # navigate 도 같은 이유로 Mutation 이다. 접수증(PlanJob)을 plan 과 함께 쓴다.
  navigate(input: NavigateInput!): PlanJob!

  # saveGraph 는 프로젝트를 통째로 덮어쓰고, updateGraph 는 역기입 한 묶음을 얹는다
  saveGraph(spec: AWSJSON!): AWSJSON!
  updateGraph(spec: AWSJSON!): AWSJSON!

  # 커넥터 키를 넣고 지운다. admin 만. 넣을 때 제공자를 한 번 찔러 보고 통과할 때만 저장한다.
  # spec: {provider, key}. 응답에 키는 없고 끝 네 글자만 있다.
  putConnector(spec: AWSJSON!): AWSJSON!
  deleteConnector(spec: AWSJSON!): AWSJSON!

  # 커넥터 모델로 한 장 만든다. plan 과 같은 이유로 Mutation 이고 접수증만 돌려준다.
  # spec: {model:"제공자:모델", prompt, kind, init, strength, seed}
  genConnector(spec: AWSJSON!): PlanJob!
  # GPU 켜고 끄기 · { action: "on" | "off" | "state" } → { state }. 리뷰어만 못 부른다(gpuPower.js)
  gpuPower(spec: AWSJSON!): AWSJSON!
  # 자산관리 올리기 · { data: data:URL(≤300KB), name } → { url }. S3 영구 보관(putImage.js)
  putImage(spec: AWSJSON!): AWSJSON!

  # 프로젝트 하나를 지운다. 카드 · 에셋 · op 로그 · Neptune 그래프 전부다.
  # 감독만 할 수 있다. 다른 일은 다시 만들면 되지만 이것은 되돌릴 자리가 없다.
  deleteProject(boardId: ID!): DeleteResult!
}

# 지우고 난 뒤의 셈. 무엇을 잃었는지 사람에게 말해 주려고 수를 센다.
#
# left 가 0 이 아니면 다 못 지운 것이고, 그때 카드(card)는 일부러 남긴다. 목록에서 그
# 프로젝트를 다시 찾아 다시 지울 수 있어야 한다. 카드를 먼저 지우면 남은 op 를 어느
# 화면에서도 가리킬 수 없다.
type DeleteResult {
  boardId: ID!
  # 지운 op 로그 줄 수. 컷·댓글·명부가 여기 있다
  ops: Int!
  # 지운 에셋 수. 대본·시놉시스·씬·키비주얼·콘티
  assets: Int!
  # 카드를 지웠는지. left 가 0 일 때만 참이다
  card: Boolean!
  # 아직 남은 줄 수. 0 이면 다 지웠다
  left: Int!
  # Neptune 그래프. 'dropped' · 'skipped' · 'failed: …'
  graph: String!
}

type Subscription {
  onOp(boardId: ID!): Op @aws_subscribe(mutations: ["publishOp"])
  onPresence(boardId: ID!): Presence @aws_subscribe(mutations: ["publishPresence"])
}
