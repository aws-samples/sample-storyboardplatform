<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 · 여름 스튜디오</title>
<link rel="icon" href="data:,">

<!--
  프로젝트 서랍. 이 프로젝트가 무엇을 들고 있는지 한 화면에 폅니다.

  ══ 왜 이 화면이 생겼나

  전에는 프로젝트에 무엇이 들었는지 볼 방법이 없었습니다. 홈의 카드에 「마지막에 누가
  뭘 했다」한 줄만 있었고(services/projects.js 의 lastWhat), 그 안의 대본이나 씬은
  화면을 하나씩 열어 봐야 알았습니다. 게다가 들어가는 길이 step 1-2-3-4 로만 나 있어서
  이미 만들어 둔 스토리보드가 무엇을 담고 있는지가 특히 안 보였습니다.

  그래서 프로젝트를 「단계의 흐름」이 아니라 「에셋의 서랍」으로 봅니다. 대본·시놉시스·
  그래프·씬·키비주얼·콘티가 그 서랍에 든 것이고, 각 화면은 그중 하나를 만드는 도구입니다.
  홈의 카드를 누르면 보드가 아니라 여기로 옵니다.

  ══ 빈 칸이 「덜 된 것」이 아닙니다

  콘티가 비어 있어도 이 프로젝트는 온전합니다. 대본과 시놉시스만 들고 계속 일하는
  사람에게 「당신은 4단계까지 못 갔다」고 말하지 않는 것이 이 화면의 핵심입니다.
  그래서 빈 줄은 경고가 아니라 회색 글씨와 「만들기」 버튼으로 섭니다.
-->
<link rel="stylesheet" href="components/theme.css">
<script src="/aws-config.js" onerror="window.SB_CONFIG=null"></script>
<style>
  *, *::before, *::after { box-sizing: border-box }
  body {
    margin: 0; font-family: var(--sb-sans); color: var(--sb-ink);
    background: var(--sb-bg); -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none }
  :focus-visible { outline: 2px solid var(--sb-accent); outline-offset: 2px; border-radius: 3px }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

  /* ── 머리 ───────────────────────────────────────── */
  .top {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 22px; border-bottom: 1px solid var(--sb-line);
    background: var(--sb-panel);
  }
  /* 브랜드의 모양은 app/components/brand.js 가 들고 있습니다 */
  .top__me { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 12.5px }
  .top__me[hidden] { display: none }
  .top__who { color: var(--sb-ink-2) }

  .wrap { max-width: 860px; margin: 0 auto; padding: 30px 22px 60px }

  /* ── 프로젝트 이름 ──────────────────────────────── */
  .head { margin-bottom: 26px }
  .head__back {
    display: inline-block; margin-bottom: 11px; font-size: 12.5px; color: var(--sb-ink-3);
  }
  .head__back:hover { color: var(--sb-accent) }
  .head__h { margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -.025em }
  .head__sub { margin: 7px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--sb-ink-3) }

  /* ── 에셋 표 ────────────────────────────────────── */
  .sect__h {
    display: flex; align-items: center; gap: 9px; margin: 0 0 12px;
    font-size: 13.5px; font-weight: 600; letter-spacing: -.01em;
  }
  .sect__h::after { content: ''; flex: 1 1 auto; height: 1px; background: var(--sb-line); order: 2 }
  .sect__n { font-family: var(--sb-mono); font-size: 11px; color: var(--sb-ink-3); order: 1 }

  .assets {
    display: grid; gap: 1px; background: var(--sb-line-2);
    border: 1px solid var(--sb-line); border-radius: var(--sb-r-lg); overflow: hidden;
  }
  /*
   * 한 줄은 [이름 · 요약 · 언제 누가 · 버튼] 입니다. 이름 칸을 고정폭으로 두어 여섯
   * 줄의 이름이 같은 자리에서 시작합니다. 그래야 훑을 때 눈이 한 줄로 내려갑니다.
   */
  .as {
    display: grid; grid-template-columns: 92px minmax(0, 1fr) auto auto;
    gap: 4px 13px; align-items: center; padding: 13px 15px; background: var(--sb-panel);
  }
  .as__name { font-size: 13px; font-weight: 600; letter-spacing: -.01em }
  .as__sum { font-size: 12.5px; color: var(--sb-ink-2); min-width: 0; word-break: break-word }
  /* 아직 없는 것. 경고가 아니라 그냥 비어 있음입니다 */
  .as--none .as__name { color: var(--sb-ink-3); font-weight: 500 }
  .as--none .as__sum { color: var(--sb-ink-3) }
  .as__who {
    font-family: var(--sb-mono); font-size: 10.5px; color: var(--sb-ink-3);
    white-space: nowrap; text-align: right;
  }
  .as__go {
    flex: none; padding: 6px 12px; font: inherit; font-size: 12.5px; cursor: pointer;
    background: var(--sb-panel); color: var(--sb-ink-2);
    border: 1px solid var(--sb-line); border-radius: var(--sb-r);
    white-space: nowrap; text-decoration: none; display: inline-block;
  }
  .as__go:hover { border-color: var(--sb-accent-line); color: var(--sb-accent); background: var(--sb-accent-soft) }
  /* 비어 있는 줄의 버튼은 「만들기」라서 조금 더 눈에 띄어야 합니다 */
  .as--none .as__go { color: var(--sb-accent); border-color: var(--sb-accent-line) }

  @media (max-width: 620px) {
    .as { grid-template-columns: minmax(0, 1fr) auto }
    .as__name { grid-column: 1 / -1 }
    .as__who { display: none }
  }

  /* ── 본문 미리보기 ──────────────────────────────── */
  /*
   * 「열기」가 그 화면으로 보내는 것과 별개로, 대본과 시놉시스는 여기서 바로 펼쳐
   * 읽을 수 있게 합니다. 무엇이 들었는지 보러 온 사람에게 가장 자주 필요한 것이
   * 「그 대본이 맞나」이고, 그걸 확인하려고 편집 화면을 열게 하면 실수로 고칩니다.
   */
  .peek { margin-top: 9px; grid-column: 1 / -1 }
  .peek summary {
    cursor: pointer; font-size: 12px; color: var(--sb-accent); padding: 2px 0;
    width: fit-content;
  }
  .peek__body {
    margin: 9px 0 2px; padding: 12px; max-height: 320px; overflow: auto;
    background: var(--sb-bg); border: 1px solid var(--sb-line); border-radius: var(--sb-r);
    font: 400 12px/1.65 var(--sb-mono); white-space: pre-wrap; word-break: break-word;
    color: var(--sb-ink-2);
  }

  .note { margin: 14px 0 0; font-size: 11.5px; line-height: 1.7; color: var(--sb-ink-3) }

  /* ── 프로젝트 지우기 ────────────────────────────────
   *
   * 서랍의 맨 아래, 다른 것과 한참 떨어진 자리입니다. 위의 여섯 줄은 「무엇이 있나」이고
   * 이것은 그것을 없애는 일이라 같은 흐름에 두지 않습니다. 되돌릴 수 없는 유일한 자리
   * 이므로 붉은 테를 두르지만, 처음부터 붉은 판을 펼쳐 두지는 않습니다 — 볼 일이 없는
   * 사람에게 위험을 계속 보여 주면 그 색이 무의미해집니다.
   */
  .danger { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--sb-line) }
  .danger__h {
    margin: 0 0 4px; font-size: 12.5px; font-weight: 600; color: var(--sb-ink-2);
  }
  .danger__p { margin: 0 0 12px; font-size: 11.5px; line-height: 1.7; color: var(--sb-ink-3) }
  .danger__go {
    padding: 8px 13px; font: inherit; font-size: 12.5px; cursor: pointer;
    background: var(--sb-panel); color: var(--sb-no);
    border: 1px solid var(--sb-no-line); border-radius: var(--sb-r);
  }
  .danger__go:hover:not(:disabled) { background: var(--sb-no-soft) }
  .danger__go:disabled { opacity: .5; cursor: default }
  /*
   * 권한이 없어 막힌 줄. 옅은 회색 안내(.danger__p)와 달리 읽고 지나가면 안 됩니다.
   * key-visual.html 의 .note--no 와 같은 판단입니다.
   */
  .danger__no {
    margin: 10px 0 0; font-size: 12px; line-height: 1.6;
    color: var(--sb-no); font-weight: 600;
  }
  .danger__done {
    margin: 12px 0 0; font-size: 12.5px; line-height: 1.7; color: var(--sb-ink-2);
  }

  /* ── 지우기 확인 창 ─────────────────────────────────
   *
   * confirm() 을 쓰지 않습니다. 브라우저의 확인 창은 한 줄밖에 못 담고 무엇보다 무엇을
   * 잃는지 세어 보여줄 수 없습니다. 「대본 5,614자와 씬 14개와 컷 340개가 사라집니다」를
   * 읽고 나서 누르는 것과 「계속할까요?」에 누르는 것은 다른 결정입니다.
   */
  dialog.ask {
    padding: 0; border: 1px solid var(--sb-line); border-radius: var(--sb-r-lg);
    background: var(--sb-panel); color: var(--sb-ink);
    width: min(440px, 100%); box-shadow: var(--sb-sh-lg);
  }
  dialog.ask::backdrop { background: rgba(15, 20, 30, .55) }
  .ask__in { padding: 22px }
  .ask__h { margin: 0 0 8px; font-size: 16.5px; font-weight: 650; letter-spacing: -.015em }
  .ask__p { margin: 0 0 13px; font-size: 12.5px; line-height: 1.7; color: var(--sb-ink-2) }
  /* 잃는 것의 목록. 셈이 그 자체로 경고입니다 */
  .ask__lose {
    margin: 0 0 15px; padding: 12px 14px; display: grid; gap: 5px;
    background: var(--sb-no-soft); border: 1px solid var(--sb-no-line);
    border-radius: var(--sb-r); font-size: 12.5px; line-height: 1.5; color: var(--sb-ink);
  }
  .ask__lose b { font-weight: 600 }
  .ask__row { display: flex; gap: 8px; justify-content: flex-end }
  .ask__no {
    padding: 9px 14px; font: inherit; font-size: 13px; cursor: pointer;
    background: var(--sb-panel); color: var(--sb-ink-2);
    border: 1px solid var(--sb-line); border-radius: var(--sb-r);
  }
  .ask__no:hover { background: var(--sb-fill); color: var(--sb-ink) }
  .ask__yes {
    padding: 9px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--sb-no); color: #fff;
    border: 1px solid var(--sb-no); border-radius: var(--sb-r);
  }
  .ask__yes:disabled { opacity: .6; cursor: default }

  /* ── 없는 프로젝트 ──────────────────────────────── */
  .gone {
    padding: 22px; background: var(--sb-panel); border: 1px solid var(--sb-line);
    border-radius: var(--sb-r-lg); font-size: 13px; line-height: 1.7; color: var(--sb-ink-2);
  }
  .gone[hidden] { display: none }
  .gone a { color: var(--sb-accent); text-decoration: underline }

  /* ── 로그인 문 ──────────────────────────────────── */
  /* app/components/login-form.js 를 그대로 씁니다. 모양은 홈(index.html)과 같습니다 */
  .gate {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(15, 20, 30, .55); backdrop-filter: blur(3px);
    display: grid; place-items: center; padding: 24px;
  }
  .gate[hidden] { display: none }
  .gate__card {
    background: var(--sb-panel); border-radius: var(--sb-r-lg); padding: 24px;
    width: min(430px, 100%); box-shadow: var(--sb-sh-lg); max-height: 100%; overflow: auto;
  }
  .gate__eyebrow {
    font-family: var(--sb-mono); font-size: 10px; letter-spacing: .18em; color: var(--sb-accent);
  }
  .gate__title { margin: 8px 0 4px; font-size: 19px; font-weight: 700; letter-spacing: -.01em }
  .gate__sub { margin: 0 0 18px; font-size: 12.5px; line-height: 1.6; color: var(--sb-ink-2) }
  .gate__list { display: grid; gap: 7px }
  .gate__who {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: var(--sb-panel); border: 1px solid var(--sb-line); border-radius: var(--sb-r);
    padding: 11px 13px; cursor: pointer; font: inherit; color: var(--sb-ink);
  }
  .gate__who:hover, .gate__who:focus-visible { background: var(--sb-fill); border-color: var(--sb-accent-line) }
  .gate__who:disabled { opacity: .5; cursor: default }
  .gate__dot { width: 24px; height: 24px; border-radius: 50%; flex: none }
  .gate__name { font-weight: 600; font-size: 13.5px }
  .gate__role {
    font-family: var(--sb-mono); font-size: 10px; letter-spacing: .1em; color: var(--sb-ink-3);
  }
  .gate__job { margin-left: auto; font-size: 11.5px; color: var(--sb-ink-3) }
  .lf { display: block; margin-bottom: 12px }
  .lf__label {
    display: block; font-family: var(--sb-mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--sb-ink-3); margin-bottom: 5px;
  }
  .lf input[type=text], .lf input[type=password] {
    width: 100%; padding: 9px 11px; font: inherit; font-size: 13.5px;
    background: var(--sb-bg); color: var(--sb-ink);
    border: 1px solid var(--sb-line); border-radius: var(--sb-r);
  }
  .lf input:focus { outline: none; border-color: var(--sb-accent); box-shadow: 0 0 0 3px var(--sb-accent-soft) }
  .lf--check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--sb-ink-2) }
  .lf--check input { margin: 0 }
  .lf__or {
    margin: 16px 0 12px; font-size: 11px; color: var(--sb-ink-3); text-align: center;
    border-top: 1px solid var(--sb-line); padding-top: 12px;
  }
  .lf__why { margin: 9px 0 0; font-size: 12px; color: var(--sb-no); min-height: 1em }
  .lf__note { margin: 12px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--sb-ink-3) }
  .btn {
    font: inherit; cursor: pointer; border-radius: var(--sb-r);
    border: 1px solid var(--sb-line); background: var(--sb-panel); color: var(--sb-ink);
    padding: 9px 14px; font-size: 13px;
  }
  .btn--solid { background: var(--sb-accent); border-color: var(--sb-accent); color: #fff; font-weight: 600 }
  .btn--solid:hover { background: var(--sb-accent-ink); border-color: var(--sb-accent-ink) }
  .btn--wide { width: 100%; margin-top: 4px }
  .btn:disabled { opacity: .55; cursor: default }
</style>
</head>
<body>

<header class="top">
  <!-- 네 화면이 같은 것을 씁니다(app/components/brand.js). 누르면 홈입니다 -->
  <div id="brandMount"></div>
  <div class="top__me" id="meBox" hidden>
    <span class="top__who" id="meWho"></span>
  </div>
</header>

<div class="wrap">
  <div class="head">
    <a class="head__back" href="/?view=projects">‹ 우리 팀 프로젝트</a>
    <h1 class="head__h" id="pjName">…</h1>
    <p class="head__sub" id="pjSub"></p>
  </div>

  <!-- 카드가 없는 boardId 로 들어온 경우 -->
  <div class="gone" id="gone" hidden></div>

  <div id="body" hidden>
    <h2 class="sect__h">이 프로젝트에 있는 것
      <span class="sect__n" id="haveN"></span>
    </h2>
    <div class="assets" id="assets"></div>
    <p class="note" id="assetNote"></p>

    <!--
      프로젝트 지우기. 서랍의 맨 아래입니다.

      이 화면에 둔 이유는 여기가 무엇을 잃는지 이미 보이는 유일한 자리라는 것입니다.
      홈의 카드에는 「마지막 손길」한 줄뿐이라 거기서 지우면 대본과 컷이 같이 사라지는
      것을 모릅니다. 서랍은 위에서 여섯 줄을 다 펴 보인 뒤에 이 버튼을 냅니다.

      감독만 누를 수 있습니다(app/domain/permissions.js 의 deleteProject). 다른 역할에게
      숨기지 않고 막힌 채로 보여 주며 왜 막혔는지 적습니다 — 버튼이 없으면 사람은 그
      기능이 없는 줄로 알고 찾아다닙니다.
    -->
    <section class="danger" id="danger" hidden>
      <h2 class="danger__h">이 프로젝트 지우기</h2>
      <p class="danger__p" id="dangerWhy"></p>
      <button class="danger__go" id="delBtn" type="button" hidden>프로젝트 지우기</button>
      <p class="danger__no" id="delNo" hidden></p>
      <p class="danger__done" id="delDone" hidden></p>
    </section>
  </div>
</div>

<p class="sr" id="live" role="status" aria-live="polite"></p>

<!-- 지우기 확인. 무엇을 잃는지 세어 보여준 뒤에 묻습니다. pages/project.js 가 채웁니다 -->
<dialog class="ask" id="ask" aria-labelledby="askH">
  <div class="ask__in">
    <h2 class="ask__h" id="askH">이 프로젝트를 지우시겠습니까?</h2>
    <p class="ask__p" id="askP"></p>
    <div class="ask__lose" id="askLose"></div>
    <div class="ask__row">
      <button class="ask__no" id="askNo" type="button">그만두기</button>
      <button class="ask__yes" id="askYes" type="button">지웁니다</button>
    </div>
  </div>
</dialog>

<div class="gate" id="gate" hidden></div>

<script type="module" src="pages/project.js"></script>
</body>
</html>
