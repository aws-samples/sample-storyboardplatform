<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자산관리 · 스토리보드</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="components/theme.css">
<style>
/* ─────────────────────────────────────────────────────────
   자산관리. 인물 · 배경 · 소품 · 스틸.

   키 비주얼과 같은 흰 배경 · 파란 한 가지 강조입니다(components/theme.css). 여기는 그림이
   주인공이라 글자는 작고 옅게, 선은 가늘게 둡니다. 왼쪽은 종류, 가운데는 격자, 오른쪽은
   고른 자산으로 실사 스틸을 만드는 칸입니다. 세 기둥이 한눈에 들어오는 폭(1280)에 맞춥니다.
   ───────────────────────────────────────────────────────── */
:root{
  --bg:var(--sb-bg); --ink:var(--sb-ink); --ink-2:var(--sb-ink-2); --ink-3:var(--sb-ink-3);
  --line:var(--sb-line); --line-2:var(--sb-line-2); --fill:var(--sb-fill); --fill-2:var(--sb-fill-2);
  --blue:var(--sb-accent); --blue-ink:var(--sb-accent-ink); --blue-w:var(--sb-accent-soft); --blue-l:var(--sb-accent-line);
  --ok:var(--sb-ok); --ok-w:var(--sb-ok-soft); --no:var(--sb-no); --no-w:var(--sb-no-soft); --wait:var(--sb-wait);
  --r:var(--sb-r); --f:var(--sb-sans); --m:var(--sb-mono);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 13.5px/1.55 var(--f);letter-spacing:-.005em;min-height:100vh}
body.viewing{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:disabled{cursor:not-allowed;opacity:.42}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--m)}

/* ── 머리 ─────────────────────────────── */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:11px 20px}
.spacer{flex:1}
.tag{font:500 11px/1 var(--m);padding:4px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2);background:var(--fill)}
#navMount .navbar{padding-top:0;padding-bottom:0;background:none}

/* ── 뼈대: 종류 | 격자 | 스틸 ─────────────── */
.shell{display:grid;grid-template-columns:172px minmax(0,1fr) 300px;min-height:calc(100vh - 82px)}
@media (max-width:1080px){.shell{grid-template-columns:150px minmax(0,1fr)}.still{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}

/* 왼쪽: 종류 */
.cats{padding:18px 12px;border-right:1px solid var(--line);display:grid;gap:2px;align-content:start}
.cats__h{font:600 10.5px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 8px 8px}
.cat{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);color:var(--ink-2);text-align:left;width:100%}
.cat:hover{background:var(--fill);color:var(--ink)}
.cat[aria-current=true]{background:var(--blue-w);color:var(--blue-ink);font-weight:600}
.cat__n{margin-left:auto;font:500 11px var(--m);color:var(--ink-3)}
.cat[aria-current=true] .cat__n{color:var(--blue)}
.cats__sep{height:1px;background:var(--line-2);margin:10px 4px}
.cats .hint{font-size:11.5px;color:var(--ink-3);line-height:1.5;padding:4px 8px}

/* 가운데: 격자 */
.grid-pane{padding:18px 20px 40px;min-width:0}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools h1{font-size:15px;font-weight:650;letter-spacing:-.01em}
.tools .count{font:500 11.5px var(--m);color:var(--ink-3);margin-left:2px}
.tools .spacer{flex:1}
.btn{padding:7px 12px;border-radius:var(--r);font-weight:600;font-size:12.5px;border:1px solid var(--line);color:var(--ink);background:#fff;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--fill)}
.btn--go{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn--go:hover:not(:disabled){background:var(--blue-ink)}
.btn--wide{width:100%}
.mini{font-size:11.5px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;color:var(--ink-2);background:#fff}
.mini:hover:not(:disabled){background:var(--fill);color:var(--ink)}
.mini--no{color:var(--no)}
.note{font-size:12px;color:var(--ink-3);line-height:1.55}
.note--no{color:var(--no)}
.note--busy{color:var(--blue)}

/* AI 로 만들기: 도구 줄 아래 한 줄 */
.make{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--fill);margin-bottom:14px}
.make textarea{width:100%;min-height:54px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;font-size:12.5px;line-height:1.5}
.make textarea:focus{border-color:var(--blue);outline:none}
.make .note{grid-column:1/-1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid--wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tile{position:relative;display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;text-align:left;padding:0;width:100%}
.tile:hover{border-color:var(--ink-3)}
.tile[aria-pressed=true]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-w)}
.tile__im{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--fill-2)}
.tile[data-type=bg] .tile__im,.tile[data-type=still] .tile__im{aspect-ratio:16/9}
.tile__cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;padding:6px 8px 7px;border-top:1px solid var(--line-2)}
.tile__name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile__meta{grid-column:1/-1;font:400 10.5px/1.3 var(--m);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile__pick{position:absolute;top:7px;left:7px;width:18px;height:18px;border-radius:50%;border:1.5px solid #fff;background:rgba(17,19,24,.35);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.tile[aria-pressed=true] .tile__pick{background:var(--blue);border-color:#fff}
.tile[aria-pressed=true] .tile__pick::after{content:'';position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
/* 크게 보기. 카드 안의 버튼이라 카드 클릭(고르기)과 겹치지 않게 stopPropagation 을 씁니다 */
.tile__zoom{position:absolute;top:6px;right:6px;padding:3px 7px;border-radius:4px;background:rgba(17,19,24,.55);color:#fff;font:500 10.5px/1.4 var(--m);opacity:0;transition:opacity .12s}
.tile:hover .tile__zoom,.tile:focus-within .tile__zoom{opacity:1}
.tile--busy .tile__im{opacity:.5}
.tile__spin{position:absolute;inset:0;display:grid;place-items:center;font:500 11px var(--m);color:var(--blue);background:rgba(255,255,255,.55)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.7;border:1px dashed var(--line);border-radius:8px}
.empty b{color:var(--ink-2)}

/* 오른쪽: 실사 스틸 */
.still{padding:18px 16px 40px;border-left:1px solid var(--line);display:grid;gap:14px;align-content:start;position:sticky;top:82px;max-height:calc(100vh - 82px);overflow-y:auto}
.still__h{font-size:14px;font-weight:650;letter-spacing:-.01em}
.still__s{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:2px}
.picked{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.pick{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--fill-2)}
.pick img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pick b{position:absolute;left:0;right:0;bottom:0;padding:2px 5px;font:500 9.5px/1.3 var(--m);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick__x{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(17,19,24,.6);color:#fff;font:600 10px/16px var(--f);text-align:center;padding:0}
.picked .empty{padding:14px 10px;grid-column:1/-1;font-size:12px}
.still textarea{width:100%;min-height:72px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--fill);font-size:12.5px;line-height:1.5}
.still textarea:focus{background:#fff;border-color:var(--blue);outline:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px;color:var(--ink-2)}
.kv dt{color:var(--ink-3);font-family:var(--m);font-size:10.5px;padding-top:1px}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-right:6px;vertical-align:1px}
.led--ready{background:var(--ok)}.led--busy{background:var(--wait);animation:pulse 1.1s ease-in-out infinite}.led--down{background:var(--no)}
@keyframes pulse{50%{opacity:.28}}
.recent{display:grid;gap:6px}
.recent__h{font:600 10.5px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* ── 뷰어. 어두운 바닥, 그림은 원본 크기까지 확대 ───────────── */
.vw{position:fixed;inset:0;z-index:80;background:rgba(17,19,24,.94);display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:#e8eaf0}
.vw[hidden]{display:none}
.vw__bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.vw__type{font:500 10.5px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:#9aa3b2}
.vw__name{font-size:14px;font-weight:600;background:none;border:0;border-bottom:1px solid transparent;color:#fff;padding:2px 0;min-width:120px;max-width:360px}
.vw__name:focus{outline:none;border-bottom-color:var(--blue)}
.vw__name[readonly]{border-bottom-color:transparent}
.vw__meta{font:400 11px var(--m);color:#9aa3b2}
.vw__bar .spacer{flex:1}
.vw__btn{padding:6px 10px;border-radius:var(--r);border:1px solid rgba(255,255,255,.18);color:#e8eaf0;font-size:12px;background:rgba(255,255,255,.04)}
.vw__btn:hover:not(:disabled){background:rgba(255,255,255,.12)}
.vw__btn[aria-pressed=true]{background:var(--blue);border-color:var(--blue)}
.vw__btn--no:hover:not(:disabled){background:rgba(220,60,60,.35)}
.vw__stage{overflow:auto;display:grid;place-items:center;cursor:zoom-in;padding:20px}
.vw__stage[data-zoom="1"],.vw__stage[data-zoom="2"]{cursor:grab;place-items:start}
.vw__stage.dragging{cursor:grabbing;user-select:none}
.vw__stage img{display:block;max-width:100%;max-height:calc(100vh - 150px);box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
.vw__stage[data-zoom="1"] img,.vw__stage[data-zoom="2"] img{max-width:none;max-height:none;margin:auto}
.vw__foot{display:flex;gap:16px;align-items:center;padding:8px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9aa3b2;flex-wrap:wrap}
.vw__foot .refs{display:flex;gap:4px}
.vw__foot .refs img{width:34px;height:34px;object-fit:cover;border-radius:4px;border:1px solid rgba(255,255,255,.15)}
.vw__foot .prompt{flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw__zoom{display:flex;gap:2px}
.vw__zoom .vw__btn{padding:4px 8px;font-family:var(--m);font-size:11px}

/* ── 로그인 창 (components/login-form.js 가 채웁니다. 키 비주얼과 같은 모양) ── */
.gate{position:fixed;inset:0;z-index:100;background:rgba(15,20,30,.55);display:grid;place-items:center;padding:24px}
.gate[hidden]{display:none}
.gate__card{background:#fff;border-radius:10px;padding:24px;width:min(430px,100%);max-height:100%;overflow:auto;box-shadow:0 18px 50px rgba(15,20,30,.32)}
.gate__eyebrow{font:500 10.5px/1 var(--m);letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
.gate__title{margin:9px 0 4px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.gate__sub{margin:0 0 16px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.gate__list{display:grid;gap:6px}
.gate__who{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.gate__who:hover:not(:disabled),.gate__who:focus-visible{background:var(--fill);border-color:var(--ink-3)}
.gate__dot{width:22px;height:22px;border-radius:50%;flex:none}
.gate__name{font-weight:600;font-size:13px}
.gate__role{font:400 10.5px/1.4 var(--m);color:var(--ink-3)}
.gate__job{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.lf{display:block;margin-bottom:11px}
.lf__label{display:block;font:500 10.5px/1 var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.lf input[type=text],.lf input[type=password]{width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font:inherit;font-size:13.5px;color:var(--ink)}
.lf input:focus{border-color:var(--blue);outline:none}
.lf--check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);margin:-2px 0 13px;cursor:pointer}
.lf--check input{accent-color:var(--blue)}
.lf__why{min-height:17px;margin:9px 0 0;font-size:12px;color:var(--no)}
.lf__or{display:flex;align-items:center;gap:10px;margin:14px 0 12px;font:500 10.5px/1 var(--m);letter-spacing:.1em;color:var(--ink-3)}
.lf__or::before,.lf__or::after{content:'';flex:1;height:1px;background:var(--line)}
.lf__note{margin:4px 0 0;padding-top:11px;border-top:1px solid var(--line-2);font-size:11.5px;line-height:1.6;color:var(--ink-3)}
.btn--solid{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn--solid:hover:not(:disabled){background:var(--blue-ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div id="brandMount"></div>
    <span class="spacer"></span>
    <span class="tag" id="whoami">…</span>
    <div id="utilMount"></div>
  </div>
  <div id="navMount"></div>
</header>

<div class="shell">
  <nav class="cats" id="cats" aria-label="자산 종류"></nav>
  <main class="grid-pane" id="main"></main>
  <aside class="still" id="still"></aside>
</div>

<!-- 크게 보기. pages/assets.js 의 paintViewer 가 채웁니다 -->
<div class="vw" id="viewer" hidden></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<p class="sr" id="live" role="status" aria-live="polite"></p>
<div class="gate" id="gate" hidden></div>

<script src="/aws-config.js" onerror="window.SB_CONFIG=null"></script>
<script type="module" src="pages/assets.js"></script>
</body>
</html>
