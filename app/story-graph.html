<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Graph · 대본에서 씨앗과 분기까지</title>
<!-- 세 화면이 나눠 쓰는 색 한 벌. 아래 :root 가 이 값을 가리킨다 -->
<link rel="stylesheet" href="components/theme.css">
<style>
  /*
   * 이 화면의 이름들은 그대로 두고 값만 공통 토큰(theme.css)을 가리킨다.
   *
   * 예전에는 따뜻한 회색 배경에 보라 강조였다. 세 화면을 탭으로 오가게 되면서
   * 여기만 강조색이 달라 다른 제품처럼 보였다. 그래서 파랑 한 가지로 모았다.
   * 이름을 바꾸지 않은 이유는 이 파일과 graph-view.js 규칙이 짧은 이름을 쓰기
   * 때문이다. 값만 갈아 끼우면 규칙은 그대로 따라온다.
   *
   * 둥근 정도만 예외로 남긴다(--r: 14px). 이 화면은 카드가 크고 그래프 위에 얹혀서
   * 6px 로 줄이면 판이 각지고 답답해진다. 대신 버튼·입력칸은 아래에서 --sb-r 로
   * 내려 잡아 다른 화면과 손끝 느낌을 맞춘다.
   */
  :root {
    --bg: var(--sb-fill);
    --bg-soft: var(--sb-fill);
    --panel: var(--sb-panel);
    --ink: var(--sb-ink);
    --ink2: var(--sb-ink-2);
    --ink3: var(--sb-ink-3);
    --line: var(--sb-line);
    --line2: var(--sb-line-2);
    --acc: var(--sb-accent);
    --acc-ink: var(--sb-accent-ink);
    --acc-soft: var(--sb-accent-soft);
    --ok: var(--sb-ok);
    --ok-ink: var(--sb-ok);
    --ok-soft: var(--sb-ok-soft);
    --warn: var(--sb-work);
    --warn-soft: var(--sb-work-soft);
    --bad: var(--sb-no);
    --bad-soft: var(--sb-no-soft);
    --sh1: var(--sb-sh);
    --sh2: var(--sb-sh-lg);
    --r: 14px;
    /*
     * 오른쪽 판의 너비. 사람이 판 왼쪽 손잡이(.side-grip)를 끌면 이 값만 갈린다
     * (story-graph.js 의 wireSideResize). 468px 은 끌기 전의 너비다.
     */
    --side-w: 468px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    font-size: 15px; line-height: 1.7; letter-spacing: -.005em;
    height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  /* 줄: 위 띠 · 기능 탭 바 · 내용. 오른쪽 칸의 너비는 --side-w 한 곳에서 온다 */
  .app { display: grid; grid-template-columns: 1fr var(--side-w); grid-template-rows: 66px auto 1fr; height: 100vh; }
  /* 탭 바는 두 칸을 다 씁니다. 탭 바 모양은 nav-tabs.js 가 들고 있습니다 */
  #navMount { grid-column: 1 / -1; min-width: 0; }
  #navMount { z-index: 19; }

  /* ── 위 띠 ─────────────────────────────────────────────────────────────── */
  .topbar {
    grid-column: 1 / -1; background: rgba(255,255,255,.88); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); display: flex; align-items: center;
    padding: 0 22px; gap: 10px; box-shadow: 0 1px 12px rgba(26,34,60,.05); z-index: 20;
  }
  /* 브랜드의 모양은 app/components/brand.js 가 들고 있습니다. h1 과 배지 둘은 없앴습니다 */
  .who { font-size: 14px; font-weight: 700; color: var(--ink2); white-space: nowrap; }
  .grow { flex: 1; }
  .graph-area { position: relative; overflow: hidden; background: var(--bg); }
  /* position 은 손잡이(.side-grip)를 이 판의 왼쪽 경계에 앉히기 위한 것이다 */
  .sidebar { position: relative; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }

  /*
   * ── 판을 넓히는 손잡이 ──────────────────────────────────────────────────────
   *
   * 판의 왼쪽 경계에 세로로 붙는다. 잡히는 자리는 손끝을 위해 7px 로 넓게 두고, 눈에
   * 보이는 선은 가운데 1px 만 그린다(::after). 늘 보이지만 판의 경계선처럼 보이고,
   * 손이 올라가면 강조색으로 「이건 잡을 수 있는 것」이라고 말한다.
   *
   * 판 밖(left: -3px)이 아니라 안쪽(left: 0)에 두는 이유는 .sidebar 가 overflow:hidden
   * 이라 밖으로 나간 만큼이 잘리는 것이다. 안쪽 7px 은 판마다 18px 여백이 있어 글자를
   * 가리지 않는다(.panel-scroll · .stats-bar).
   */
  .side-grip {
    position: absolute; left: 0; top: 0; bottom: 0; width: 7px; z-index: 12;
    background: none; border: none; padding: 0; cursor: col-resize; touch-action: none;
  }
  .side-grip::after {
    content: ''; position: absolute; left: 3px; top: 0; bottom: 0; width: 1px;
    background: var(--line2); transition: background .14s, box-shadow .14s;
  }
  .side-grip:hover::after, .side-grip.on::after, .side-grip:focus-visible::after {
    background: var(--acc); box-shadow: 0 0 0 1px var(--acc-soft);
  }
  .side-grip:focus { outline: none; }
  /*
   * 끄는 동안에는 온 화면의 글자를 잡지 못하게 한다. 판 안에는 대본과 표가 있어서,
   * 이것이 없으면 옆으로 끄는 손이 글을 긁어 놓고 끌기가 그쪽에 먹힌다.
   */
  body.side-drag, body.side-drag * { cursor: col-resize !important; user-select: none !important; }
  #network { width: 100%; height: 100%; }

  /* ── 버튼 · 입력 ────────────────────────────────────────────────────────── */
  button { font-family: inherit; }
  .btn {
    padding: 12px 17px; background: var(--acc);
    border: none; border-radius: var(--sb-r); color: #fff; font-size: 14.5px; font-weight: 700;
    letter-spacing: -.01em; cursor: pointer; box-shadow: var(--sh1);
    transition: transform .14s, box-shadow .14s, filter .14s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); background: var(--acc-ink); box-shadow: var(--sh2); }
  .btn:active:not(:disabled) { transform: translateY(0); filter: brightness(.97); }
  .btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .btn--line {
    background: #fff; border: 1px solid var(--line); color: var(--ink2);
    font-weight: 600; box-shadow: none;
  }
  .btn--line:hover:not(:disabled) { border-color: var(--sb-accent-line); color: var(--acc-ink); background: var(--acc-soft); }
  .btn--wide { width: 100%; }
  .btn--mini { padding: 8px 12px; font-size: 13px; border-radius: var(--sb-r); }
  /*
   * 다음 단계로 넘어가는 단추. 한 카드에 하나만 씁니다.
   *
   * 카드 안의 단추가 다 같은 크기였습니다. 그래서 「대본화」처럼 다음 화면으로 데려가는
   * 것과 「닫기」가 같은 무게로 서 있었고, 스토리를 다 만든 사람이 어디를 눌러야 이어지는지
   * 카드를 다시 읽어야 알았습니다. 다음 걸음만 크게 둡니다.
   */
  .btn--lg { padding: 16px 22px; font-size: 16.5px; border-radius: 10px; }
  /*
   * 링크로 된 단추. 다른 화면으로 데려가는 자리는 <a> 라야 합니다 — 새 탭으로 열거나
   * 주소를 복사하는 길이 남고, 스크린리더도 「누르는 것」이 아니라 「가는 것」으로 읽습니다.
   */
  a.btn { display: inline-block; text-align: center; text-decoration: none; }

  textarea, select, input[type="text"], input[type="password"] {
    width: 100%; background: #fff; border: 1px solid var(--line); border-radius: var(--sb-r);
    color: var(--ink); font-family: inherit; font-size: 15px; line-height: 1.7; padding: 11px 13px;
    transition: border-color .14s, box-shadow .14s;
  }
  textarea { resize: vertical; }
  textarea:focus, select:focus, input:focus {
    outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft);
  }
  textarea::placeholder { color: var(--ink3); }

  /* ── 모델 고르기 ────────────────────────────────────────────────────────────
     이 화면의 모든 Bedrock 호출(추출·요약·분기·대본)이 여기서 고른 모델로 간다.
     이름은 infra/resolvers/plan.js 의 MODELS 키와 짝이 맞아야 한다. */
  .model-pick { margin-bottom: 13px; }
  .model-pick label {
    display: block; font-size: 12px; font-weight: 800; color: var(--ink3);
    text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px;
  }
  .model-pick select {
    font-size: 13.5px; line-height: 1.5; padding: 9px 11px; border-radius: var(--sb-r);
    cursor: pointer; font-weight: 600; color: var(--ink);
  }
  .model-pick select:disabled { background: var(--bg-soft); color: var(--ink3); cursor: default; }
  .model-pick .hint { margin-top: 6px; font-size: 12.5px; }

  /* ── 그래프 위에 얹는 카드 ─────────────────────────────────────────────── */
  .card {
    position: absolute; z-index: 5; background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 18px; padding: 17px; box-shadow: var(--sh1);
  }
  .card h3 {
    font-size: 12.5px; font-weight: 800; color: var(--ink3); text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 11px; display: flex; align-items: center; gap: 8px;
  }
  .card--input { top: 18px; left: 18px; width: 392px; }
  .card--input.drop { border-color: var(--acc); box-shadow: 0 0 0 5px var(--acc-soft), var(--sh2); }
  .card--node { bottom: 18px; left: 18px; width: 392px; max-height: 48%; overflow-y: auto; }
  .card__row { display: flex; gap: 9px; margin-top: 12px; }

  .hint { font-size: 13.5px; color: var(--ink3); line-height: 1.7; margin-top: 9px; }
  .warn { font-size: 14px; color: var(--warn); line-height: 1.7; margin-top: 9px; }
  .err { font-size: 14.5px; color: var(--bad); line-height: 1.7; margin-top: 9px; font-weight: 500; }
  .ok { font-size: 14.5px; color: var(--ok-ink); line-height: 1.7; margin-top: 9px; font-weight: 600; }

  .legend {
    position: absolute; z-index: 5; right: 18px; bottom: 18px; display: flex; flex-wrap: wrap;
    gap: 8px 15px; max-width: 400px; justify-content: flex-end; align-items: center;
    background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border: 1px solid var(--line);
    border-radius: 999px; padding: 11px 18px; box-shadow: var(--sh1);
  }
  .legend span { font-size: 13px; font-weight: 600; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
  .legend i {
    width: 13px; height: 13px; border-radius: 50%; display: inline-block;
    background: radial-gradient(circle at 33% 28%, rgba(255,255,255,.9), var(--c) 58%, rgba(0,0,0,.18));
    box-shadow: 0 2px 4px rgba(26,34,60,.22);
  }
  .legend i.line { width: 18px; height: 0; border-radius: 0; background: none; box-shadow: none; border-top: 2px solid var(--ink2); }
  .legend i.dash { width: 18px; height: 0; border-radius: 0; background: none; box-shadow: none; border-top: 2px dashed var(--ink3); }
  /* 아래 여백이 더 넓은 이유는 판 아래에 도구 띠가 앉기 때문입니다(.canvas-tools) */
  .canvas-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--ink3); font-size: 15.5px; line-height: 2;
    padding: 48px 48px 110px; pointer-events: none;
  }
  .canvas-msg b { color: var(--acc-ink); }

  /*
   * ── 판 아래의 도구 띠 ───────────────────────────────────────────────────
   *
   * 판 하단 가운데에 한 줄로 앉는다. 안내를 다시 여는 길과, 처음 온 사람을 위한
   * 「예시로 보기」 한 줄이 여기 든다.
   *
   * 예전에는 둘 다 다른 곳에 있었다. 「안내 다시 보기」는 위 띠에 큰 단추로 있었고,
   * 처음 온 사람 안내는 대본 카드 오른쪽에 520px 카드로 떠서 판의 절반을 덮었다.
   * 둘 다 늘 보여야 하는 것이 아니라 필요할 때 찾으면 되는 것이라, 눈이 가장 덜 가는
   * 자리인 판 아래로 내렸다. 위 띠에는 사람과 프로젝트에 관한 것만 남는다.
   *
   * pointer-events 를 띠에서 끊고 안의 것들만 되살린다. 띠는 판 위에 걸쳐 있으므로
   * 그대로 두면 빈 자리가 그래프의 드래그를 먹는다.
   *
   * bottom 이 범례(.legend, right:18 bottom:18) 한 칸 위인 이유. 같은 높이에 두면 가운데로
   * 모은 이 띠가 오른쪽으로 400px 까지 넓어지는 범례와 겹친다. 한 칸 올려 두면 화면 폭이
   * 어떻든 겹치지 않는다. 판이 이 띠를 피해 앉도록 insets().b 도 같이 잡아 두었다.
   */
  .canvas-tools {
    position: absolute; z-index: 6; left: 0; right: 0; bottom: 74px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 0 22px; pointer-events: none;
  }
  .canvas-tools > * { pointer-events: auto; }
  .canvas-tools__row { display: flex; align-items: center; gap: 7px; }
  /* 안의 안내 줄(.ehint)이 자기 여백을 갖고 있어 여기서는 판만 깐다 */
  .onbslot {
    background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 15px;
    box-shadow: var(--sh1);
  }
  .onbslot[hidden] { display: none }
  /*
   * 안내를 다시 여는 길. 늘 있지만 작다. 이것을 찾는 사람은 이미 「그 설명 어디
   * 갔지」를 떠올린 사람이라, 눈에 먼저 들어올 필요가 없다.
   */
  .tool-ghost {
    background: rgba(255,255,255,.88); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px;
    font: inherit; font-size: 12px; color: var(--ink3); cursor: pointer;
  }
  .tool-ghost:hover { color: var(--acc-ink); border-color: var(--sb-accent-line); }

  .kv { display: grid; grid-template-columns: 62px 1fr; gap: 5px 12px; font-size: 14.5px; }
  .kv .k { color: var(--ink3); font-weight: 600; }
  .kv .v { color: var(--ink); word-break: break-all; }
  .edge-line { font-size: 14px; color: var(--ink2); line-height: 1.85; }
  .edge-line b { color: var(--acc-ink); font-weight: 700; }
  .edge-line.der { color: var(--ink3); }

  /* ── 사이드바 ───────────────────────────────────────────────────────────── */
  .stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 16px 18px;
    border-bottom: 1px solid var(--line2); background: var(--panel); flex-shrink: 0;
  }
  .stat { background: var(--bg-soft); border: 1px solid var(--line2); border-radius: 13px; padding: 11px 12px; }
  .stat .n { font-size: 27px; font-weight: 800; line-height: 1.15; letter-spacing: -.03em; color: var(--ink); }
  .stat .l { font-size: 12.5px; font-weight: 600; color: var(--ink3); margin-top: 3px; }

  /*
   * 판을 300px 까지 좁힐 수 있으므로(손잡이) 넷이 다 못 들어가는 폭이 생긴다. 그때
   * 이름을 세로로 접지 않고 띠가 옆으로 밀리게 둔다 — 「씨/앗」 처럼 두 줄로 접히면
   * 탭이 탭으로 보이지 않는다. 스크롤바는 감춘다. 안 감추면 띠가 두 배로 높아진다.
   */
  .tabs {
    display: flex; gap: 7px; padding: 12px 14px; border-bottom: 1px solid var(--line2);
    background: var(--panel); flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 10px 18px; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--ink3);
    border-radius: 11px; transition: all .15s; user-select: none; white-space: nowrap; flex: 0 0 auto;
  }
  .tab:hover { color: var(--ink); background: var(--bg-soft); }
  .tab.active { color: var(--acc-ink); background: var(--acc-soft); }
  .panel { display: none; flex-direction: column; overflow: hidden; flex: 1; }
  .panel.active { display: flex; }
  .panel-scroll { overflow-y: auto; flex: 1; padding: 18px; }
  .panel-scroll::-webkit-scrollbar { width: 9px; }
  .panel-scroll::-webkit-scrollbar-track { background: transparent; }
  .panel-scroll::-webkit-scrollbar-thumb { background: var(--line); border: 3px solid var(--panel); border-radius: 999px; }
  .panel-scroll::-webkit-scrollbar-thumb:hover { background: var(--ink3); }

  /* ── 씨앗 카드 ──────────────────────────────────────────────────────────── */
  .seed-card {
    background: #fff; border: 1px solid var(--line); border-radius: 17px; margin-bottom: 14px;
    box-shadow: var(--sh1); overflow: hidden;
    transition: transform .16s, box-shadow .16s, border-color .16s;
  }
  .seed-card:hover { transform: translateY(-2px); box-shadow: var(--sh2); }
  .seed-card.on { border-color: var(--acc); box-shadow: 0 0 0 4px var(--acc-soft), var(--sh2); }
  /* 탐지기별 파스텔 그라디언트 머리. --p1/--p2/--pi 는 JS 가 씨앗마다 꽂아 준다 */
  .seed-head {
    display: flex; align-items: center; gap: 10px; padding: 13px 15px;
    background: linear-gradient(135deg, var(--p1, var(--acc-soft)), var(--p2, var(--bg-soft)));
    border-bottom: 1px solid rgba(255,255,255,.7);
  }
  /*
   * 씨앗 카드 머리에는 모델이 붙인 제목과 점수만 든다. 예전에는 여기 탐지기 이름표
   * (.probe-tag)가 서고 제목은 아래 본문 첫 줄이었다. 이름표를 빼면서 제목을 그 자리로
   * 올렸다 — 머리에 점수만 남기면 카드가 숫자 하나로 시작한다.
   *
   * .probe-tag 규칙 자체는 남는다. 대본화 탭의 머리줄(renderExpand)이 분기 번호·이름을
   * 같은 알약 모양으로 얹는다. 씨앗의 탐지기 이름을 적는 자리는 이제 없다.
   */
  .probe-tag {
    font-size: 13px; font-weight: 800; letter-spacing: -.01em; color: var(--pi, var(--acc-ink));
    background: rgba(255,255,255,.75); border-radius: 999px; padding: 6px 13px; white-space: nowrap;
  }
  .seed-score { margin-left: auto; font-size: 14px; font-weight: 800; color: var(--pi, var(--acc-ink)); }
  /* 역기입 뒤에 새로 나온 씨앗. 판의 새 노드·엣지와 같은 녹색을 쓴다 (graph-view.js) */
  .seed-card.is-new { border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft), var(--sh1); }
  .seed-new-tag {
    display: flex; align-items: center; gap: 6px; padding: 7px 15px;
    background: var(--ok); color: #fff; font-size: 12.5px; font-weight: 800; letter-spacing: -.01em;
  }
  .seed-new-tag::before { content: '✦'; font-size: 11px; }
  .new-badge {
    font-size: 10.5px; font-weight: 800; letter-spacing: .04em; color: #fff;
    background: var(--ok); border-radius: 999px; padding: 4px 9px; line-height: 1;
  }
  .seed-body { padding: 15px 16px 16px; }
  /* 머리 안에서 남는 자리를 다 쓴다. min-width:0 이 없으면 긴 제목이 점수를 밀어낸다 */
  .seed-title {
    flex: 1; min-width: 0; font-size: 19px; font-weight: 800; line-height: 1.45;
    letter-spacing: -.02em; color: var(--ink); cursor: pointer; overflow-wrap: break-word;
  }
  .seed-title:hover { color: var(--acc-ink); }
  .seed-rationale { font-size: 15.5px; color: var(--ink2); line-height: 1.75; margin-bottom: 11px; }
  /* 이 소재가 왜 이 자리인가. 순서를 고른 이유를 한 줄로 받아 적는다 (refineSeeds) */
  .seed-why {
    font-size: 13.5px; line-height: 1.6; color: var(--pi, var(--acc-ink));
    border-left: 3px solid var(--p1, var(--acc-soft)); padding-left: 9px; margin-bottom: 11px;
  }
  .seed-focus { font-size: 13.5px; color: var(--ink3); margin-bottom: 14px; }

  /* ── 스토리 · 분기 ──────────────────────────────────────────────────────── */
  .story-content { font-size: 15.5px; line-height: 1.75; padding-bottom: 26px; }
  .story-content h1 { font-size: 25px; font-weight: 800; letter-spacing: -.03em; line-height: 1.35; margin-bottom: 12px; }
  .seed-info {
    display: flex; flex-wrap: wrap; align-items: center; gap: 9px;
    background: linear-gradient(135deg, var(--p1, var(--acc-soft)), var(--p2, var(--bg-soft)));
    border: 1px solid rgba(255,255,255,.8); border-radius: 14px; padding: 13px 15px;
    margin-bottom: 16px; font-size: 14px; color: var(--ink2); line-height: 1.6;
  }
  /* 이 분기가 어느 씨앗에서 왔는지. 탐지기 이름표가 아니라 그 씨앗의 제목을 적는다 */
  .seed-name { font-size: 15px; font-weight: 800; letter-spacing: -.015em; color: var(--ink); }
  .logline { color: var(--ink2); font-size: 16.5px; line-height: 1.8; margin-bottom: 16px; }
  .pivot-box {
    background: var(--warn-soft); border: 1px solid var(--sb-work-line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 16px; font-size: 15px; line-height: 1.75;
  }
  .pivot-box .ttl { color: var(--warn); font-weight: 800; font-size: 15.5px; display: block; margin-bottom: 5px; }
  .pivot-box .bd { color: var(--ink2); }

  .branch-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(98px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .branch-chip {
    background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 13px 10px;
    text-align: center; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink2);
    line-height: 1.45; box-shadow: var(--sh1); transition: all .15s;
  }
  .branch-chip:hover { transform: translateY(-2px); border-color: var(--sb-accent-line); color: var(--ink); box-shadow: var(--sh2); }
  .branch-chip.on {
    border-color: var(--acc); background: var(--acc-soft); color: var(--acc-ink);
    box-shadow: 0 0 0 3px var(--acc-soft), var(--sh2);
  }
  .branch-chip .bid { display: block; font-size: 23px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); margin-bottom: 3px; }
  .branch-chip.on .bid { color: var(--acc-ink); }

  .branch-head { font-size: 22px; font-weight: 800; letter-spacing: -.025em; line-height: 1.4; margin-bottom: 7px; }
  .branch-tone {
    display: inline-block; font-size: 13px; font-weight: 700; background: var(--bg-soft);
    border: 1px solid var(--line2); border-radius: 999px; padding: 4px 12px; color: var(--ink2); margin-bottom: 11px;
  }
  .branch-premise {
    font-size: 15.5px; color: var(--ink2); line-height: 1.8; margin-bottom: 16px;
    padding: 2px 0 2px 14px; border-left: 3px solid var(--sb-accent-line);
  }

  .beats { margin-bottom: 16px; }
  .beat { display: flex; gap: 12px; font-size: 15.5px; color: var(--ink); line-height: 1.75; margin-bottom: 12px; }
  .beat .no {
    flex-shrink: 0; width: 25px; height: 25px; margin-top: 2px; border-radius: 9px;
    background: var(--acc-soft); color: var(--acc-ink); font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }

  .sec-label {
    font-size: 12.5px; font-weight: 800; color: var(--ink3); text-transform: uppercase;
    letter-spacing: .09em; margin: 24px 0 11px;
  }
  .outcome { display: grid; grid-template-columns: 88px 1fr; gap: 4px 12px; font-size: 15px; margin-bottom: 8px; }
  .outcome .k { color: var(--ink3); font-weight: 700; }
  .outcome .v { color: var(--ink); }

  .wb-box { background: var(--ok-soft); border: 1px solid var(--sb-ok-line); border-radius: 14px; padding: 13px 15px; font-size: 14px; line-height: 1.75; }
  .wb-box .item { color: var(--ink2); padding: 2px 0; }
  .wb-box .item::before { content: "+ "; color: var(--ok); font-weight: 800; }
  .wb-box .item.cut::before { content: "− "; color: var(--bad); }
  .wb-box .item.cut { color: var(--ink3); text-decoration: line-through; }
  .wb-box .item .p { color: var(--acc-ink); font-weight: 600; }
  .wb-box .item .nt { color: var(--ink3); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .wb-sum { font-size: 14.5px; color: var(--ink2); margin-bottom: 9px; }
  .wb-sum b { color: var(--ok-ink); font-weight: 800; }
  .wb-sum i { color: var(--bad); font-style: normal; font-weight: 800; }

  .free-box { background: var(--bg-soft); border: 1.5px dashed var(--line); border-radius: 16px; padding: 17px; margin-top: 20px; }
  .free-box h4 { font-size: 15.5px; font-weight: 800; color: var(--ink); margin-bottom: 9px; }

  /* ── 지나간 일 ────────────────────────────────────────────────────────────
     목록 자체의 모양(.hist*)은 app/history.js 가 넣는다. 홈·보드·키비주얼이 같은
     목록을 쓰기 때문에 화면마다 베껴 두지 않는다. 여기 있는 것은 머리줄과 꼬리말이다. */
  .hist-head {
    display: flex; align-items: center; gap: 9px; margin-bottom: 12px;
    font-size: 12.5px; font-weight: 800; color: var(--ink3);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .hist-head .btn { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .hist-head .btn[aria-pressed="true"] {
    border-color: var(--sb-accent-line); color: var(--acc-ink); background: var(--acc-soft);
  }
  .hist-note { margin-top: 12px; font-size: 12.5px; color: var(--ink3); line-height: 1.75; }

  .placeholder { text-align: center; color: var(--ink3); padding: 30px 18px; font-size: 15px; line-height: 1.95; }
  .placeholder b { color: var(--acc-ink); }
  .load-error { padding: 26px; color: var(--bad); font-size: 15px; line-height: 1.9; }
  .spin {
    display: inline-block; width: 15px; height: 15px; border: 2.5px solid var(--line2);
    border-top-color: var(--acc); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px;
  }
  @keyframes sp { to { transform: rotate(360deg) } }
  .busy { display: flex; align-items: center; gap: 10px; color: var(--ink2); font-size: 15px; font-weight: 600; padding: 20px 4px; }

  .cmp { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; margin-top: 8px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line2); }
  .cmp th { background: var(--bg-soft); color: var(--ink2); padding: 9px 10px; border-bottom: 1px solid var(--line2); font-weight: 700; text-align: left; }
  .cmp tr > th:first-child { white-space: nowrap; color: var(--ink3); }
  .cmp td { padding: 9px 10px; border-bottom: 1px solid var(--line2); color: var(--ink2); vertical-align: top; line-height: 1.6; }
  .cmp tr:last-child td, .cmp tr:last-child th { border-bottom: none; }
  .cmp td.on { background: var(--acc-soft); color: var(--acc-ink); font-weight: 600; }

  /* ── 분기 → 대본 · 대본화 ───────────────────────────────────────────────── */
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
  .opt-grid label { font-size: 13px; font-weight: 700; color: var(--ink3); display: flex; flex-direction: column; gap: 6px; }
  .opt-grid label.wide { grid-column: 1 / -1; }
  .step-bar { display: flex; gap: 7px; margin-bottom: 16px; }
  .step {
    flex: 1; font-size: 12.5px; font-weight: 700; text-align: center; padding: 8px 4px;
    border-radius: 10px; background: var(--bg-soft); border: 1.5px solid var(--line2); color: var(--ink3);
  }
  .step.done { border-color: var(--sb-ok-line); background: var(--ok-soft); color: var(--ok-ink); }
  .step.on { background: var(--acc-soft); border-color: var(--acc); color: var(--acc-ink); }
  .cut-row {
    background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px;
    margin-bottom: 9px; font-size: 15px; line-height: 1.75; box-shadow: 0 1px 2px rgba(26,34,60,.04);
  }
  .cut-row .hd { display: flex; flex-wrap: wrap; gap: 9px; font-size: 12.5px; font-weight: 600; color: var(--ink3); margin-bottom: 5px; }
  .cut-row .hd .no { color: var(--acc-ink); font-weight: 800; }
  .cut-row .ac { color: var(--ink); }
  .cut-row .dl { color: var(--acc-ink); font-weight: 500; }
  pre.script {
    background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 17px;
    font-family: ui-monospace, Menlo, 'Malgun Gothic', monospace; font-size: 15px; line-height: 1.95;
    color: var(--ink); white-space: pre-wrap; word-break: break-word; max-height: 46vh; overflow: auto;
    box-shadow: inset 0 1px 3px rgba(26,34,60,.04);
  }
  .ep-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
  .ep-chips .branch-chip { flex: 0 0 auto; padding: 9px 15px; font-size: 14px; }

  /* ── 로그인 문 ──────────────────────────────────────────────────────────── */
  .gate {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 28px; overflow: auto;
    background: linear-gradient(140deg, var(--acc-soft) 0%, var(--bg) 55%, var(--bg) 100%);
  }
  .gate__card {
    width: 100%; max-width: 470px; background: #fff; border-radius: 24px; padding: 34px;
    box-shadow: var(--sh2); border: 1px solid var(--line);
  }
  .gate__eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--acc); margin-bottom: 8px; }
  .gate__title { font-size: 27px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 10px; }
  .gate__sub { font-size: 15px; color: var(--ink2); line-height: 1.75; margin-bottom: 22px; }
  .gate__list { display: grid; gap: 8px; margin-bottom: 6px; }
  .gate__who {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; cursor: pointer;
    padding: 11px 14px; border: 1px solid var(--line); border-radius: 13px; background: #fff;
    font-family: inherit; font-size: 14.5px; transition: all .14s;
  }
  .gate__who:hover:not(:disabled) { border-color: var(--sb-accent-line); background: var(--acc-soft); transform: translateY(-1px); }
  .gate__who:disabled { opacity: .5; cursor: default; }
  .gate__dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 1px 3px rgba(26,34,60,.25); }
  .gate__name { font-size: 15px; font-weight: 700; color: var(--ink); }
  .gate__role { font-size: 12.5px; color: var(--ink3); }
  .gate__job { margin-left: auto; font-size: 12.5px; color: var(--ink3); text-align: right; }
  .lf { display: block; margin-bottom: 14px; }
  .lf__label { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink2); margin-bottom: 7px; }
  .lf--check { display: flex; align-items: center; gap: 9px; font-size: 14.5px; color: var(--ink2); }
  .lf--check input { width: 17px; height: 17px; accent-color: var(--acc); }
  .lf__or { text-align: center; font-size: 13px; font-weight: 700; color: var(--ink3); margin: 16px 0 14px; }
  .lf__why { min-height: 22px; font-size: 14px; font-weight: 600; color: var(--bad); line-height: 1.6; margin-top: 10px; }
  .lf__note { font-size: 13px; color: var(--ink3); line-height: 1.75; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <!--
      머리의 왼쪽은 네 화면이 같습니다. 「S 여름 스튜디오」이고 누르면 홈입니다
      (app/components/brand.js).

      예전에는 여기에 「Story Graph」 와 배지 둘(모드 확인 중 · graph: …)이 있었습니다.
      같은 서비스인데 화면마다 다른 제품 이름이 걸려 있었고, 배지 둘은 보는 사람이 할 일과
      상관없는 값이라 머리만 길었습니다. 지금 어느 화면인지는 아래 탭 바가 말합니다.
    -->
    <div id="brandMount"></div>
    <div class="grow"></div>
    <!--
      위 띠에는 사람에 관한 것만 남깁니다. 「안내 다시 보기」는 판 아래 도구 띠로,
      「대본 입력 접기」는 그 카드 자기 머리로 옮겼습니다. 둘 다 늘 큰 단추로 서 있을
      일이 아니고, 특히 접기는 어느 카드를 접는다는 말인지 여기서는 알 수 없었습니다.
    -->
    <span class="who" id="whoAmI" hidden></span>
    <button class="btn btn--line btn--mini" id="logoutBtn" hidden>로그아웃</button>
    <!--
      아키텍처 · 권한 관리 · 홈. 탭 바의 오른쪽 끝에 있던 것을 여기로 올렸습니다.
      담는 것은 nav-tabs.js 의 mountNav 이고(utilMount) 모양도 그 파일에 있습니다(.navutil).
      세 화면이 같은 부품을 쓰므로 한 곳에 두어야 셋이 함께 얻습니다.
    -->
    <div id="utilMount"></div>
  </div>

  <!-- 상단 기능 탭. index.html 과 같은 탭 바를 nav-tabs.js 에서 받아 쓴다 -->
  <div id="navMount"></div>

  <div class="graph-area">
    <div id="network"></div>
    <div class="canvas-msg" id="canvasMsg" hidden></div>

    <!--
      판 아래 가운데의 도구 띠. 안내를 다시 여는 길과, 비어 있을 때의 「예시로 보기」
      한 줄이 든다. 안내 줄의 모양은 components/empty-panel.js 가 넣는다(.ehint*).
    -->
    <div class="canvas-tools" id="canvasTools">
      <div class="onbslot" id="onbSlot" hidden></div>
      <div class="canvas-tools__row">
        <!-- 대본 카드를 접으면 그 안의 접기 단추도 같이 사라집니다. 다시 펴는 길이 여기입니다 -->
        <button class="tool-ghost" id="inputShow" type="button" hidden>대본 입력 펼치기</button>
        <button class="tool-ghost" id="coachBtn" type="button">안내 보기</button>
      </div>
    </div>

    <section class="card card--input" id="inputCard" data-coach="input">
      <!--
        접기 단추가 이 카드 머리에 있습니다. 예전에는 위 띠에 있었는데, 거기서는 무엇을
        접는다는 말인지 알 수 없었고 이 카드와 멀어서 접은 뒤에 다시 펴는 길도 눈에서
        멀었습니다. 접으면 이 카드가 사라지므로 펴는 단추는 아래 #inputShow 입니다.
      -->
      <h3>대본 · 시놉시스
        <button class="btn btn--line btn--mini" id="inputToggle" style="margin-left:auto">접기</button>
      </h3>

      <!-- 고른 모델은 이 화면의 모든 생성에 쓰인다. 값은 plan 리졸버의 MODELS 키다 -->
      <div class="model-pick">
        <label for="modelSel">모델</label>
        <select id="modelSel">
          <option value="haiku-4.5">Haiku 4.5 · 빠른 초안 · 구조와 뼈대를 빠르게 잡을 때</option>
          <option value="sonnet-5" selected>Sonnet 5 · 균형잡힌 작업 · 대부분의 작업에 추천 (기본값)</option>
          <option value="opus-4.8">Opus 4.8 · 깊이 있는 창작 · 캐릭터 심리와 대사에 강함, 느리고 비용 높음</option>
        </select>
        <div class="hint" id="modelHint">추출 · 요약 · 분기 · 대본 생성에 모두 이 모델을 씁니다.</div>
      </div>

      <textarea id="scriptIn" rows="7" spellcheck="false"
        placeholder="시놉시스나 대본을 붙여 넣거나 .txt / .fdx 파일을 이 카드로 끌어다 놓습니다.
예: 새벽에 문 여는 동네 빵집. 주인은 첫 손님이 오기까지..."></textarea>
      <div class="card__row">
        <button class="btn" id="extractBtn" data-coach="extract">그래프 추출</button>
        <button class="btn btn--line" id="mockBtn">예시 대본으로 보기</button>
      </div>
      <!--
        여기에는 이 카드에 무엇을 어떻게 넣는지만 적습니다. 예전에는 「최소 8자 이상.
        추출은 Bedrock 연결이 필요합니다.」였는데, 둘 다 넣기 전에 알 필요가 없는 말입니다.
        여덟 자는 아무도 어기지 않고, Bedrock 은 이 화면을 쓰는 사람의 일이 아닙니다.
        정말 필요할 때는 story-graph.js 의 extract 가 같은 자리에 그때 적습니다.
      -->
      <div class="hint" id="inputHint">시놉시스나 대본을 붙여 넣거나 .txt / .fdx 파일을 이 카드에 끌어 넣어주세요.</div>
    </section>

    <section class="card card--node" id="nodeCard" hidden>
      <h3>노드 <button class="btn btn--line btn--mini" id="nodeClose" style="margin-left:auto">닫기</button></h3>
      <div id="nodeBody"></div>
    </section>

    <!-- 종류별 구체 색은 graph-view.js 의 KIND_COLOR 한 곳에서 온다 -->
    <div class="legend" id="legend"></div>
  </div>

  <div class="sidebar">
    <!--
      판의 왼쪽 경계. 끌면 판이 왼쪽으로 넓어집니다(story-graph.js 의 wireSideResize).
      최소 300px · 최대 화면의 70% 이고, 두 번 누르면 처음 너비로 돌아옵니다.
      화살표로도 잡히도록 tabindex 와 separator 역할을 줍니다.
    -->
    <div class="side-grip" id="sideGrip" tabindex="0" role="separator" aria-orientation="vertical"
         aria-label="오른쪽 판 너비" title="끌어서 판을 넓힙니다 · 두 번 누르면 처음 너비"></div>
    <div class="stats-bar" data-coach="stats">
      <div class="stat"><div class="n" id="s-nodes">-</div><div class="l">노드</div></div>
      <div class="stat"><div class="n" id="s-asserted">-</div><div class="l">명시 엣지</div></div>
      <div class="stat"><div class="n" id="s-derived">-</div><div class="l">추론</div></div>
      <div class="stat"><div class="n" id="s-seeds">-</div><div class="l">씨앗</div></div>
    </div>
    <div class="tabs" data-coach="tabs">
      <div class="tab active" data-tab="seeds">씨앗</div>
      <div class="tab" data-tab="story">스토리</div>
      <div class="tab" data-tab="script">대본화</div>
      <div class="tab" data-tab="hist">지나간 일</div>
    </div>
    <div id="panel-seeds" class="panel active">
      <div class="panel-scroll" id="seedsList"></div>
    </div>
    <div id="panel-story" class="panel">
      <div class="panel-scroll" id="storyPanel"><div class="placeholder">씨앗을 골라 스토리를 생성합니다.</div></div>
    </div>
    <div id="panel-script" class="panel">
      <div class="panel-scroll" id="scriptPanel"></div>
    </div>
    <!--
      지나간 일. 누가 · 어떤 단계에서 · 뭘 · 언제 했는지. 이 화면이 따로 쌓는 것이
      아니라 보드의 op 로그 한 곳을 읽는다. 그래서 다른 사람이 키비주얼에서 한 일도
      여기 보인다. 옮기는 일은 app/history.js 가 한다.
    -->
    <div id="panel-hist" class="panel">
      <div class="panel-scroll" data-coach="histbox">
        <div class="hist-head">지나간 일
          <button class="btn btn--line btn--mini" id="histMine" type="button"
                  aria-pressed="false" title="내가 등록한 것만 봅니다">내 것만</button>
        </div>
        <div id="hist"></div>
        <p class="hist-note">줄을 누르면 그 자리에서 이어서 합니다. 회차는 대본화 탭이 열립니다.</p>
      </div>
    </div>
  </div>

</div>

<!-- 이 화면을 새 탭에서 바로 열었을 때의 로그인 문. 토큰이 있으면 아예 안 나온다 -->
<div class="gate" id="gate" hidden></div>

<script src="./aws-config.js"></script>
<script type="module" src="./pages/story-graph.js"></script>
</body>
</html>
